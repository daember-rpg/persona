<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Bonds Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

/* ==========================================================================
   Persona — Embermark design language
   Spacing in multiples of 8; Cinzel for display, Spectral for text.
   ========================================================================== */

:root {
    --dp-charcoal: #1c1a17;
    --dp-charcoal-2: #25221e;
    --dp-charcoal-3: #302b26;
    --dp-night: #0f0e0c;
    --dp-line: rgba(234, 223, 196, 0.12);
    --dp-line-strong: rgba(234, 223, 196, 0.24);
    --dp-parchment: #eadfc4;
    --dp-parchment-dim: #b9ab8d;
    --dp-parchment-faint: #857a65;
    --dp-clay: #b4643e;
    --dp-clay-light: #d68a5c;
    --dp-clay-soft: rgba(180, 100, 62, 0.22);
    --dp-moss: #74864a;
    --dp-moss-soft: rgba(116, 134, 74, 0.25);
    --dp-ember: #c8452f;
    --dp-ember-soft: rgba(200, 69, 47, 0.2);
    --dp-gold: #c9a35a;
    --dp-scrim: rgba(10, 9, 8, 0.72);
    --dp-display: "Cinzel", "Palatino Linotype", "Book Antiqua", serif;
    --dp-body: "Spectral", Georgia, "Times New Roman", serif;
    --dp-radius: 6px;
    --dp-1: 8px;
    --dp-2: 16px;
    --dp-3: 24px;
    --dp-4: 32px;
}

/* Reset Foundry's generic control styles inside our UI. */
:where(.persona) button {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--dp-body);
}

:where(.persona) button:focus-visible {
    outline: 2px solid var(--dp-clay-light);
    outline-offset: 2px;
}

:where(.persona) button:hover,
:where(.persona) button:focus {
    background: none;
    box-shadow: none;
    text-shadow: none;
}

/* Foundry's own button rules can win over the reset above; set layout explicitly. */
.persona .persona-chip,
.persona .persona-mini,
.persona .persona-button,
.persona .persona-icon-btn,
.persona .persona-cell,
.persona .persona-card__close,
.persona .persona-video__close,
.persona .persona-note__delete,
.persona .persona-chip-remove,
.persona .persona-tabs button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1;
}

.persona .persona-chip > *,
.persona .persona-mini > * {
    flex: none;
}

:where(.persona) button:disabled {
    cursor: default;
    opacity: 0.4;
}

.persona {
    font-family: var(--dp-body);
    color: var(--dp-parchment);
}

.persona *, .persona *::before, .persona *::after {
    box-sizing: border-box;
}

.persona h2, .persona h3 {
    margin: 0;
    border: 0;
    text-wrap: balance;
}

.persona-eyebrow {
    font-family: var(--dp-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dp-clay-light);
}

.persona-hint {
    margin: 0;
    display: flex;
    gap: 6px;
    align-items: baseline;
    font-size: 12px;
    color: var(--dp-parchment-faint);
}

.persona-empty-line {
    margin: 0;
    font-size: 14px;
    font-style: italic;
    color: var(--dp-parchment-faint);
}

.persona-row__spacer {
    flex: 1;
}

/* ---------- Shared controls ---------- */

.persona .persona-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.persona .persona-chip {
    height: 26px;
    padding: 0 10px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 999px;
    font-size: 13px;
    color: var(--dp-parchment-dim);
    white-space: nowrap;
}

.persona .persona-chip i {
    font-size: 10px;
    opacity: 0.8;
}

.persona .persona-chip:hover {
    border-color: var(--dp-clay);
    color: var(--dp-parchment);
}

.persona .persona-chip.is-active {
    border-color: var(--dp-clay);
    background: var(--dp-clay-soft);
    color: var(--dp-parchment);
}

.persona .persona-chip.is-static {
    cursor: default;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.persona-chip__count {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--dp-parchment-faint);
}

.persona .persona-mini {
    height: 26px;
    padding: 0 8px;
    border: 1px solid var(--dp-line);
    border-radius: 4px;
    background: var(--dp-charcoal-2);
    font-size: 12px;
    color: var(--dp-parchment-dim);
    white-space: nowrap;
}

.persona .persona-mini:hover:not(:disabled) {
    border-color: var(--dp-clay);
    color: var(--dp-parchment);
}

.persona .persona-mini.is-on {
    border-color: var(--dp-clay);
    background: var(--dp-clay-soft);
    color: var(--dp-parchment);
}

.persona .persona-mini--icon {
    width: 26px;
    padding: 0;
}

.persona .persona-button {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--dp-radius);
    background: var(--dp-clay);
    font-size: 13px;
    font-weight: 600;
    color: var(--dp-night);
}

.persona .persona-button:hover {
    background: var(--dp-clay-light);
}

.persona .persona-button--danger {
    background: transparent;
    border: 1px solid var(--dp-ember);
    color: #e58a74;
}

.persona .persona-button--danger:hover {
    background: var(--dp-ember-soft);
}

.persona .persona-icon-btn {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line-strong);
    color: var(--dp-parchment-dim);
    font-size: 13px;
}

.persona .persona-icon-btn:hover {
    border-color: var(--dp-clay);
    color: var(--dp-parchment);
}

.persona .persona-icon-btn.is-on {
    border-color: var(--dp-clay);
    background: var(--dp-clay-soft);
    color: var(--dp-parchment);
}

.persona .persona-icon-btn--accent {
    background: var(--dp-clay);
    border-color: var(--dp-clay);
    color: var(--dp-night);
}

.persona .persona-icon-btn--accent:hover {
    background: var(--dp-clay-light);
    color: var(--dp-night);
}

.persona-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--dp-ember);
    color: var(--dp-parchment);
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
    text-align: center;
}

.persona input[type="text"],
.persona input[type="search"],
.persona textarea {
    width: 100%;
    margin: 0;
    padding: 6px 10px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
    color: var(--dp-parchment);
    font-family: var(--dp-body);
    font-size: 14px;
    box-shadow: none;
}

.persona input:focus,
.persona textarea:focus {
    outline: none;
    border-color: var(--dp-clay);
    box-shadow: 0 0 0 1px var(--dp-clay);
}

.persona textarea {
    resize: vertical;
    min-height: 64px;
    line-height: 1.45;
}

/* Every view of a portrait uses the framing chosen in the editor. */
.persona img.persona-fit {
    object-fit: cover;
    object-position: var(--fx, 50%) var(--fy, 20%);
    transform: scale(var(--zoom, 1));
    transform-origin: var(--fx, 50%) var(--fy, 20%);
}

/* ==========================================================================
   Panel (own window or Triad tab)
   ========================================================================== */

.persona-host {
    height: 100%;
}

.triad-dock[data-dock="persona"] {
    padding: 0;
    overflow: hidden;
}

.persona-panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--dp-charcoal);
}

.persona-head {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: var(--dp-2) var(--dp-2) 12px;
    border-bottom: 1px solid var(--dp-line);
}

.persona-head__title {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--dp-1);
}

.persona-head__title h2 {
    font-family: var(--dp-display);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--dp-parchment);
}

.persona-head__tools {
    display: flex;
    gap: 6px;
}

.persona-search {
    display: flex;
    align-items: center;
    gap: var(--dp-1);
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
    color: var(--dp-parchment-faint);
}

.persona .persona-search input {
    height: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
}

.persona .persona-search input:focus {
    box-shadow: none;
}

.persona-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: var(--dp-2);
    display: flex;
    flex-direction: column;
    gap: var(--dp-3);
    scrollbar-width: thin;
    scrollbar-color: var(--dp-charcoal-3) transparent;
}

.persona-section {
    display: flex;
    flex-direction: column;
    gap: var(--dp-2);
}

.persona-section__label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--dp-parchment-faint);
}

.persona-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--dp-1);
    padding: var(--dp-4) var(--dp-2);
    text-align: center;
    color: var(--dp-parchment-faint);
}

.persona-empty i {
    font-size: 28px;
    color: var(--dp-clay);
    opacity: 0.6;
}

.persona-empty p {
    margin: 0;
    max-width: 30ch;
    font-style: italic;
}

/* ---------- Player gallery ---------- */

.persona-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 10px;
}

.persona-gallery--places {
    grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
}

.persona .persona-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 6px;
    min-width: 0;
    text-align: left;
}

.persona-tile__img,
.persona .persona-row__img,
.persona-card__art,
.persona-toast img {
    background: radial-gradient(ellipse at 50% 38%, rgba(214, 138, 92, 0.28), transparent 62%), linear-gradient(var(--dp-charcoal-2), #3a2a1c);
}

.persona-tile__img {
    display: block;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border: 1px solid var(--dp-line-strong);
    border-radius: var(--dp-radius);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.persona-tile--place .persona-tile__img {
    aspect-ratio: 16 / 9;
}

.persona-tile__img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    border: 0;
    display: block;
}

.persona-tile:hover .persona-tile__img {
    transform: translateY(-2px);
    border-color: var(--dp-clay-light);
}

.persona-tile__name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    line-height: 1.25;
    color: var(--dp-parchment);
}

.persona-tile__name.is-unknown {
    font-family: var(--dp-display);
    letter-spacing: 0.2em;
    color: var(--dp-parchment-faint);
}

.persona-tile__new {
    position: absolute;
    top: 6px;
    left: 6px;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--dp-ember);
    font-family: var(--dp-display);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dp-parchment);
}

.persona-tile__private {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--dp-scrim);
    font-size: 10px;
    color: var(--dp-gold);
}

/* ---------- GM director ---------- */

.persona-audience {
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    padding: 12px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona-audience p {
    margin: 0;
    font-size: 12px;
    color: var(--dp-parchment-faint);
}

.persona-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    padding-bottom: var(--dp-2);
    border-bottom: 1px solid var(--dp-line);
}

.persona-row:last-child {
    padding-bottom: 0;
    border-bottom: 0;
}

.persona .persona-row__img {
    width: 48px;
    height: 64px;
    overflow: hidden;
    border: 1px solid var(--dp-line-strong);
    border-radius: 4px;
}

.persona-row__img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    border: 0;
}

.persona-row__main {
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    min-width: 0;
}

.persona-row__name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 600;
}

.persona-row__name small {
    font-weight: 400;
    font-style: italic;
    color: var(--dp-parchment-faint);
}

.persona-row__groups {
    font-size: 12px;
    color: var(--dp-parchment-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.persona-layers {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
}

.persona .persona-layer {
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    padding: 2px 4px 3px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 4px;
    font-size: 11px;
    color: var(--dp-parchment-faint);
}

.persona .persona-layer > span:first-child {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.persona .persona-layer.is-all {
    border-color: var(--dp-moss);
    background: var(--dp-moss-soft);
    color: var(--dp-parchment);
}

.persona .persona-layer.is-some {
    border-color: var(--dp-gold);
    border-style: dashed;
    color: var(--dp-parchment);
}

.persona-layer__who {
    display: flex;
    gap: 3px;
    min-height: 5px;
}

.persona-layer__who i {
    display: block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--dp-charcoal-3);
}

.persona-layer__who i.is-on {
    background: var(--dp-moss);
}

.is-all .persona-layer__who i.is-on {
    background: var(--dp-clay-light);
}

.persona-row__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
}

.persona-drop {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--dp-1);
    padding: 12px;
    border: 1px dashed var(--dp-line-strong);
    border-radius: var(--dp-radius);
    font-size: 13px;
    color: var(--dp-parchment-faint);
    text-align: center;
}

.persona-drop.is-over {
    border-color: var(--dp-clay);
    background: var(--dp-clay-soft);
    color: var(--dp-parchment);
}

/* ---------- Folders ---------- */

.persona .persona-folder {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: var(--dp-1);
    width: 100%;
    padding: 6px 0;
    border-bottom: 1px solid var(--dp-line);
    font-family: var(--dp-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dp-parchment);
}

.persona .persona-folder:hover {
    color: var(--dp-clay-light);
}

.persona-folder i {
    font-size: 11px;
    color: var(--dp-clay-light);
}

.persona .persona-folder .persona-folder__chevron {
    width: 12px;
    color: var(--dp-parchment-faint);
    transition: transform 0.2s ease;
}

.persona-folder.is-collapsed .persona-folder__chevron {
    transform: rotate(-90deg);
}

.persona-folder__label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: left;
}

.persona-folder__count {
    font-family: var(--dp-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    color: var(--dp-parchment-faint);
}

.persona-rows {
    display: flex;
    flex-direction: column;
    gap: var(--dp-2);
}

/* ---------- Reveal status (row) ---------- */

.persona .persona-status {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr)) 14px;
    align-items: center;
    gap: 4px;
    width: 100%;
    padding: 4px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona .persona-status:hover {
    border-color: var(--dp-clay);
}

.persona-status--static {
    cursor: default;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona-status__layer {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 0;
    height: 24px;
    padding: 0 4px;
    border-radius: 4px;
    font-size: 11px;
    line-height: 1;
    white-space: nowrap;
    color: var(--dp-parchment-faint);
}

.persona-status__layer i {
    font-size: 10px;
}

.persona-status__layer > span {
    overflow: hidden;
    text-overflow: ellipsis;
}

.persona-status__layer b {
    position: absolute;
    top: -7px;
    right: -3px;
    padding: 0 4px;
    border-radius: 6px;
    background: var(--dp-gold);
    font-size: 9px;
    font-weight: 700;
    line-height: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--dp-night);
}

.persona-status__layer.is-all {
    background: var(--dp-moss-soft);
    color: var(--dp-parchment);
}

.persona-status__layer.is-all i {
    color: #a9bd78;
}

.persona-status__layer.is-some {
    background: rgba(201, 163, 90, 0.16);
    color: var(--dp-parchment);
}

.persona-status__layer.is-some i {
    color: var(--dp-gold);
}

.persona-status__layer.is-disabled {
    opacity: 0.35;
}

.persona .persona-status .persona-status__chevron {
    justify-self: center;
    font-size: 10px;
    color: var(--dp-parchment-faint);
    transition: transform 0.2s ease;
}

.persona-row.is-open .persona-status__chevron {
    transform: rotate(180deg);
}

.persona-row.is-open .persona-status {
    border-color: var(--dp-clay);
}

/* ---------- Reveal grid ---------- */

.persona-reveal {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    padding: 12px;
    border: 1px solid var(--dp-clay);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona-reveal__scroll {
    overflow-x: auto;
}

.persona-reveal__grid {
    width: 100%;
    margin: 0;
    border: 0;
    border-collapse: separate;
    border-spacing: 4px;
    background: none;
    font-size: 12px;
}

.persona-reveal__grid tr,
.persona-reveal__grid thead,
.persona-reveal__grid tbody {
    background: none !important;
    border: 0;
}

.persona-reveal__grid th,
.persona-reveal__grid td {
    padding: 0;
    border: 0;
    text-align: center;
    background: none;
}

.persona-reveal__grid tbody th {
    padding-right: 4px;
    text-align: left;
    font-weight: 400;
    white-space: nowrap;
    color: var(--dp-parchment-dim);
}

.persona-reveal__grid thead th {
    font-family: var(--dp-display);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dp-parchment-faint);
}

.persona-reveal__grid tr.is-disabled th {
    opacity: 0.4;
}

.persona-reveal__all {
    padding-right: 6px !important;
    border-right: 1px solid var(--dp-line) !important;
}

.persona-avatar {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--who, var(--dp-parchment-faint));
    font-family: var(--dp-display);
    font-size: 11px;
    font-weight: 700;
    color: var(--dp-night);
}

.persona .persona-cell {
    width: 28px;
    height: 26px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 4px;
    font-size: 11px;
    color: var(--dp-parchment-faint);
}

.persona .persona-cell:hover:not(:disabled) {
    border-color: var(--dp-clay-light);
    color: var(--dp-parchment);
}

.persona .persona-cell.is-on {
    border-color: var(--dp-moss);
    background: var(--dp-moss);
    color: var(--dp-night);
}

.persona .persona-cell.is-some {
    border-color: var(--dp-gold);
    border-style: dashed;
    color: var(--dp-gold);
}

.persona-reveal__quick {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.persona-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
}

/* ---------- Show a card to players (handout) ---------- */

.persona-share {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    padding: 12px;
    border: 1px solid var(--dp-clay);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona-share--card {
    padding: 10px 12px;
}

/* ==========================================================================
   Card
   ========================================================================== */

.persona-card-layer {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: var(--dp-3);
    background: var(--dp-scrim);
}

.persona-card-layer[hidden] {
    display: none;
}

/*
 * Person: the card is as tall as the portrait (3:4) and the text scrolls beside it,
 * so the picture is never stretched or padded. Place: a 16:9 banner on top.
 */
.persona-card {
    --card-h: min(640px, calc(100vh - 48px));
    position: relative;
    width: min(calc(var(--card-h) * 3 / 4 + 460px), 100%);
    height: var(--card-h);
    display: grid;
    grid-template-columns: calc(var(--card-h) * 3 / 4) minmax(0, 1fr);
    overflow: hidden;
    border: 1px solid var(--dp-line-strong);
    border-radius: 10px;
    background: var(--dp-charcoal);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    animation: persona-rise 0.28s ease-out;
}

.persona-card--place {
    width: min(820px, 100%);
    height: auto;
    max-height: calc(100vh - 48px);
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
}

@keyframes persona-rise {
    from { transform: translateY(12px); opacity: 0.4; }
    to { transform: none; opacity: 1; }
}

.persona .persona-card__close {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
    width: 32px;
    height: 32px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 50%;
    background: var(--dp-charcoal-2);
    color: var(--dp-parchment-dim);
}

.persona .persona-card__close:hover {
    border-color: var(--dp-clay-light);
    color: var(--dp-parchment);
}

.persona-card__art {
    position: relative;
    height: 100%;
    overflow: hidden;
    border-radius: 10px 0 0 10px;
}

.persona-card--place .persona-card__art {
    height: auto;
    border-radius: 10px 10px 0 0;
}

.persona-card__frame {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.persona-card--place .persona-card__frame {
    height: auto;
    aspect-ratio: 16 / 9;
}

.persona-card__frame img {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

/* Soft edge where the picture meets the text. */
.persona-card__art::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, transparent 82%, rgba(28, 26, 23, 0.6));
}

.persona-card--place .persona-card__art::after {
    background: linear-gradient(transparent 70%, var(--dp-charcoal));
}

.persona .persona-card__play {
    position: absolute;
    left: var(--dp-2);
    bottom: var(--dp-2);
    z-index: 1;
}

.persona-card__body {
    display: flex;
    flex-direction: column;
    gap: var(--dp-2);
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: var(--dp-3);
    scrollbar-width: thin;
    scrollbar-color: var(--dp-charcoal-3) transparent;
}

.persona-card h3 {
    padding-right: 40px;
    font-family: var(--dp-display);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1.15;
    color: var(--dp-parchment);
}

.persona-card h3.is-unknown {
    letter-spacing: 0.3em;
    color: var(--dp-parchment-faint);
}

.persona-card__title {
    margin: -10px 0 0;
    font-style: italic;
    color: var(--dp-parchment-dim);
}

.persona-card__summary {
    max-width: 62ch;
    font-size: 15px;
    line-height: 1.55;
    color: var(--dp-parchment);
}

.persona-card__summary h1,
.persona-card__summary h2,
.persona-card__summary h3,
.persona-card__summary h4 {
    margin: 16px 0 8px;
    border: 0;
    font-family: var(--dp-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dp-clay-light);
}

.persona-card__summary p { margin: 0 0 8px; }
.persona-card__summary ul { margin: 0 0 8px; padding-left: 18px; }
.persona-card__summary a { color: var(--dp-clay-light); }

.persona-card__summary img {
    float: none !important;
    display: block;
    max-width: 100%;
    max-height: 260px;
    margin: 8px 0;
    border-radius: var(--dp-radius);
}

.persona-card__summary > :first-child { margin-top: 0; }
.persona-card__summary > :last-child { margin-bottom: 0; }
.persona-card__summary img { max-width: 100%; height: auto; border: 0; }

.persona-locked {
    margin: 0;
    padding: 10px 12px;
    display: flex;
    gap: var(--dp-1);
    align-items: baseline;
    border: 1px dashed var(--dp-line-strong);
    border-radius: var(--dp-radius);
    font-size: 14px;
    color: var(--dp-parchment-faint);
}

.persona-secret {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    border: 1px solid var(--dp-ember);
    border-radius: var(--dp-radius);
    background: var(--dp-ember-soft);
}

.persona-secret .persona-eyebrow {
    color: #e58a74;
}

.persona-secret p { margin: 0; }

.persona-audit {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.persona-links {
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
}

.persona-links__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: var(--dp-1);
}

.persona .persona-link {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    min-width: 0;
    font-size: 12px;
    text-align: left;
}

.persona-link img {
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    object-position: center 20%;
    border: 1px solid var(--dp-line-strong);
    border-radius: 4px;
    background: radial-gradient(ellipse at 50% 38%, rgba(214, 138, 92, 0.28), transparent 62%), linear-gradient(var(--dp-charcoal-2), #3a2a1c);
}

.persona-link:hover img {
    border-color: var(--dp-clay-light);
}

.persona-link span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.persona-link b {
    position: absolute;
    top: 4px;
    left: 4px;
    padding: 1px 4px;
    border-radius: 3px;
    background: var(--dp-ember);
    font-family: var(--dp-display);
    font-size: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.persona-link.is-hidden img {
    filter: brightness(0.4) grayscale(0.6);
}

.persona-notes {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.persona-tabs {
    display: flex;
    gap: var(--dp-2);
    border-bottom: 1px solid var(--dp-line);
}

.persona .persona-tabs button {
    margin-bottom: -1px;
    padding: 6px 0;
    border-bottom: 2px solid transparent;
    font-family: var(--dp-display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dp-parchment-faint);
}

.persona .persona-tabs button[aria-selected="true"] {
    border-bottom-color: var(--dp-clay);
    color: var(--dp-parchment);
}

.persona-note {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) auto;
    gap: var(--dp-1);
    align-items: start;
    font-size: 14px;
}

.persona-note__who {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--who, var(--dp-parchment-faint));
    font-family: var(--dp-display);
    font-size: 11px;
    font-weight: 700;
    color: var(--dp-night);
}

.persona-note__text p {
    margin: 0;
    overflow-wrap: anywhere;
}

.persona-note__text span {
    font-size: 12px;
    color: var(--dp-parchment-faint);
}

.persona .persona-note__delete {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--dp-parchment-faint);
}

.persona .persona-note__delete:hover {
    color: #e58a74;
    background: var(--dp-ember-soft);
}

.persona-note-form {
    display: flex;
    gap: 6px;
}

.persona-video__tag {
    align-self: center;
    padding: 0 6px;
    font-family: var(--dp-display);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dp-clay-light);
}

/* ==========================================================================
   Video
   ========================================================================== */

.persona-video {
    position: fixed;
    inset: 0;
    z-index: 1100;
    display: grid;
    place-items: center;
    background: #000;
    container-type: size;
}

.persona-video[hidden] {
    display: none;
}

.persona-video__box {
    position: relative;
    width: min(100cqw, calc(100cqh * 16 / 9));
    aspect-ratio: 16 / 9;
}

.persona-video__box video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
}

.persona-video__title {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
}

.persona-video__title[hidden] {
    display: none;
}

.persona-video__title.is-in {
    animation: persona-title 6s ease-in-out forwards;
}

.persona-video__title span {
    font-family: var(--dp-display);
    font-size: clamp(18px, 3.4cqw, 48px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dp-parchment);
    text-shadow: 0 2px 18px #000;
}

.persona-video__title small {
    font-size: clamp(12px, 1.5cqw, 22px);
    font-style: italic;
    color: var(--dp-parchment-dim);
    text-shadow: 0 1px 8px #000;
}

@keyframes persona-title {
    0%, 12% { opacity: 0; transform: translateY(8px); }
    30%, 75% { opacity: 1; transform: none; }
    100% { opacity: 0; }
}

.persona-video__progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
}

.persona-video__progress i {
    display: block;
    width: 0;
    height: 100%;
    background: var(--dp-clay);
}

.persona .persona-video__close {
    position: absolute;
    top: var(--dp-2);
    right: var(--dp-2);
    width: 40px;
    height: 40px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 50%;
    background: rgba(28, 26, 23, 0.85);
    color: var(--dp-parchment);
}

.persona .persona-video__close[hidden],
.persona .persona-video__unmute[hidden] {
    display: none;
}

.persona .persona-video__unmute {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--dp-clay);
    color: var(--dp-night);
    font-weight: 600;
}

.persona-video__tools {
    position: absolute;
    left: 50%;
    bottom: var(--dp-2);
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 6px;
    border: 1px solid var(--dp-line-strong);
    border-radius: 10px;
    background: rgba(28, 26, 23, 0.92);
    opacity: 0.25;
    transition: opacity 0.3s ease;
}

.persona-video:hover .persona-video__tools {
    opacity: 1;
}

/* ==========================================================================
   Toasts
   ========================================================================== */

.persona-toasts {
    position: fixed;
    top: 72px;
    right: calc(var(--persona-safe-right, 320px) + 4px);
    z-index: 1050;
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    width: min(300px, calc(100vw - 32px));
    pointer-events: none;
}

.persona .persona-toast {
    justify-content: flex-start;
    gap: 10px;
    padding: 8px 12px 8px 8px;
    border: 1px solid var(--dp-clay);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    font-size: 14px;
    text-align: left;
    color: var(--dp-parchment);
    pointer-events: auto;
    animation: persona-rise 0.3s ease-out;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.persona-toast.is-leaving {
    opacity: 0;
    transform: translateX(12px);
}

.persona-toast img {
    width: 34px;
    height: 44px;
    flex: none;
    object-fit: cover;
    border: 0;
    border-radius: 3px;
}

.persona-toast b {
    display: block;
    font-family: var(--dp-display);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dp-clay-light);
}

/* ==========================================================================
   Editor (Foundry window)
   ========================================================================== */

.persona-editor .window-content {
    padding: 0;
    background: var(--dp-charcoal);
}

.persona-editor__root {
    display: flex;
    flex-direction: column;
}

.persona-editor__body {
    display: flex;
    flex-direction: column;
    gap: var(--dp-3);
    padding: var(--dp-3);
}

.persona-editor__top {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr);
    gap: var(--dp-2);
}

.persona-editor__framing {
    display: flex;
    flex-direction: column;
    gap: var(--dp-1);
    width: 160px;
}

.persona-framer {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border: 1px solid var(--dp-line-strong);
    border-radius: var(--dp-radius);
    background: radial-gradient(ellipse at 50% 38%, rgba(214, 138, 92, 0.28), transparent 62%), linear-gradient(var(--dp-charcoal-2), #3a2a1c);
    cursor: grab;
    touch-action: none;
}

.persona-framer.is-place {
    aspect-ratio: 16 / 9;
}

.persona-framer.is-dragging {
    cursor: grabbing;
    border-color: var(--dp-clay);
}

.persona-framer img {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    pointer-events: none;
    user-select: none;
}

.persona-framer__hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px;
    background: rgba(15, 14, 12, 0.75);
    font-size: 12px;
    color: var(--dp-parchment-dim);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
}

.persona-framer:hover .persona-framer__hint {
    opacity: 1;
}

.persona-zoom {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--dp-parchment-faint);
}

.persona-zoom input {
    flex: 1;
    min-width: 0;
    accent-color: var(--dp-clay);
}

.persona-editor__identity {
    display: flex;
    flex-direction: column;
    gap: var(--dp-2);
    min-width: 0;
}

.persona-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.persona-label {
    font-family: var(--dp-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dp-parchment-dim);
}

.persona-label small {
    margin-left: 6px;
    font-family: var(--dp-body);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--dp-parchment-faint);
}

.persona-radio {
    display: flex;
    gap: var(--dp-2);
    font-size: 14px;
}

.persona-radio label,
.persona-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--dp-parchment);
}

.persona-linked {
    display: flex;
    align-items: center;
    gap: var(--dp-1);
    padding: 6px 6px 6px 10px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
}

.persona-linked__name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
}

.persona-inline {
    display: flex;
    gap: 6px;
    align-items: center;
}

.persona-chip-wrap {
    display: inline-flex;
    align-items: center;
}

.persona .persona-chip-remove {
    width: 18px;
    height: 18px;
    margin-left: -4px;
    border-radius: 50%;
    font-size: 9px;
    color: var(--dp-parchment-faint);
}

.persona .persona-chip-remove:hover {
    color: #e58a74;
}

.persona-icons {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
}

.persona-icons__option {
    position: relative;
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border: 1px solid var(--dp-line);
    border-radius: 4px;
    font-size: 12px;
    color: var(--dp-parchment-faint);
    cursor: pointer;
}

.persona-icons__option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.persona-icons__option:has(input:checked) {
    border-color: var(--dp-clay);
    background: var(--dp-clay-soft);
    color: var(--dp-parchment);
}

.persona-editor__summary {
    max-height: 180px;
    overflow-y: auto;
    padding: 8px 12px;
    border: 1px solid var(--dp-line);
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
    font-size: 14px;
    line-height: 1.5;
    color: var(--dp-parchment-dim);
}

.persona-editor__summary img { float: none !important; display: block; max-width: 100%; max-height: 160px; border: 0; }
.persona-editor__summary h1, .persona-editor__summary h2, .persona-editor__summary h3 { margin: 12px 0 6px; border: 0; font-family: var(--dp-display); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dp-clay-light); }
.persona-editor__summary > :first-child { margin-top: 0; }
.persona-editor__summary > :last-child { margin-bottom: 0; }

.persona-editor__footer {
    display: flex;
    align-items: center;
    gap: var(--dp-1);
    padding: 12px var(--dp-3);
    border-top: 1px solid var(--dp-line);
    background: var(--dp-charcoal-2);
}

/* Standalone window */
.persona-window .window-content {
    padding: 0;
    background: var(--dp-charcoal);
}

/* ==========================================================================
   Small screens and motion
   ========================================================================== */

@media (max-width: 760px) {
    .persona-card {
        width: 100%;
        height: auto;
        max-height: calc(100vh - 48px);
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
    }
    .persona-card__art {
        height: auto;
        border-radius: 10px 10px 0 0;
    }
    .persona-card__frame {
        height: auto;
        aspect-ratio: 3 / 4;
        max-height: 50vh;
    }
}

@media (prefers-reduced-motion: reduce) {
    .persona *,
    .persona *::before,
    .persona *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

/* Small linked portraits keep the focus point but not the zoom (no clipping box around them). */
.persona .persona-link img.persona-fit {
    transform: none;
}

/* ==========================================================================
   Status (alive / dead / missing)
   ========================================================================== */

.persona-tile.is-dead .persona-tile__img img,
.persona-card.is-dead .persona-card__frame img {
    filter: grayscale(1) brightness(0.7);
}

.persona-tile.is-missing .persona-tile__img img,
.persona-card.is-missing .persona-card__frame img {
    filter: grayscale(0.6) sepia(0.25) brightness(0.85);
}

.persona-tile__status {
    position: absolute;
    bottom: 26px;
    right: 6px;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--dp-scrim);
    border: 1px solid var(--dp-line-strong);
    font-size: 10px;
    color: var(--dp-parchment);
}

.persona-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 0;
    padding: 1px 7px;
    border-radius: 3px;
    font-family: var(--dp-display);
    font-size: 10px;
    font-style: normal;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    vertical-align: middle;
    background: var(--dp-charcoal-3);
    color: var(--dp-parchment-dim);
}

.persona-status-tag.is-dead { background: rgba(234, 223, 196, 0.1); color: var(--dp-parchment); }
.persona-status-tag.is-missing { background: rgba(201, 163, 90, 0.18); color: var(--dp-gold); }
.persona-status-tag--card { margin-top: 6px; }

/* ==========================================================================
   Bonds — the relationship wheel
   ========================================================================== */

.persona-bonds-window .window-content {
    padding: 0;
    overflow: hidden;
    background: var(--dp-night);
}

.persona-bonds-host {
    position: relative;
    height: 100%;
}

.persona.bonds-host {
    font-family: var(--dp-body);
    color: var(--dp-parchment);
}

.bonds {
    position: relative;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%;
    background:
        radial-gradient(ellipse at 42% 52%, rgba(180, 100, 62, 0.14), transparent 60%),
        linear-gradient(160deg, #1d1915, var(--dp-night) 70%);
    outline: none;
    user-select: none;
}

/* ---------- Bar ---------- */

.bonds-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--dp-2);
    padding: 12px var(--dp-2) 12px var(--dp-3);
    border-bottom: 1px solid var(--dp-line);
    background: rgba(28, 26, 23, 0.85);
}

.bonds-bar__title h2 {
    margin: 2px 0 0;
    border: 0;
    font-family: var(--dp-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dp-parchment);
}

.bonds-bar__title h2 small {
    margin-left: 6px;
    font-family: var(--dp-body);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--dp-parchment-dim);
}

.bonds-players {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.bonds-bar__tools {
    display: flex;
    gap: var(--dp-1);
    margin-left: auto;
}

.persona .bonds-tool {
    background: transparent;
    border: 1px solid var(--dp-line-strong);
    color: var(--dp-parchment-dim);
    font-weight: 500;
}

.persona .bonds-tool:hover {
    background: var(--dp-clay-soft);
    border-color: var(--dp-clay);
    color: var(--dp-parchment);
}

.persona .bonds-tool.is-on {
    background: var(--dp-clay-soft);
    border-color: var(--dp-clay-light);
    color: var(--dp-parchment);
}

.persona .bonds-tool--accent {
    background: var(--dp-clay);
    border-color: var(--dp-clay);
    color: var(--dp-night);
}

.persona .bonds-tool--accent:hover {
    background: var(--dp-clay-light);
    color: var(--dp-night);
}

/* ---------- Main: viewport + drawer ---------- */

.bonds-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 232px;
    min-height: 0;
}

.bonds-viewport {
    position: relative;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
}

.bonds-viewport.is-panning { cursor: grabbing; }

.bonds-stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1000px;
    height: 1000px;
    transform-origin: 0 0;
}

.bonds-svg {
    position: absolute;
    inset: 0;
    overflow: visible;
}

.bonds-grid { stroke: rgba(234, 223, 196, 0.05); stroke-width: 1; fill: none; }
.bonds-ring { stroke: rgba(234, 223, 196, 0.16); stroke-width: 1; fill: none; }
.bonds-ring--party { stroke: rgba(214, 138, 92, 0.45); stroke-width: 1.5; }
.bonds-ring--self { stroke: rgba(201, 163, 90, 0.5); }
.bonds-party-band { stroke: rgba(180, 100, 62, 0.16); fill: none; }
.bonds-party-label { font-family: var(--dp-display); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; fill: var(--dp-clay-light); opacity: 0.8; }

.bonds-sector { stroke-width: 1.5; stroke-opacity: 0.7; }
.bonds-divider { fill: none; stroke-width: 1; stroke-opacity: 0.35; stroke-dasharray: 3 5; }
.bonds-cell { fill: transparent; transition: fill 0.12s ease; }
.bonds-cell.is-target { fill: rgba(234, 223, 196, 0.16); stroke: var(--dp-parchment); stroke-width: 1.5; stroke-dasharray: 4 4; }

.bonds-sector-label {
    font-family: var(--dp-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    paint-order: stroke;
    stroke: rgba(15, 14, 12, 0.8);
    stroke-width: 3px;
}

.bonds.is-editable .bonds-sector-label { cursor: pointer; }
.bonds.is-editable .bonds-sector-label:hover { filter: brightness(1.35); text-decoration: underline; }

.bonds-empty-ring { fill: none; stroke: rgba(234, 223, 196, 0.18); stroke-width: 2; stroke-dasharray: 6 8; }
.bonds-empty-text { font-family: var(--dp-display); font-size: 18px; letter-spacing: 0.12em; fill: var(--dp-parchment-faint); }

.bonds-link { fill: none; stroke-width: 2.5; stroke-opacity: 0.85; stroke-linecap: round; }
.bonds-rubber { fill: none; stroke: var(--dp-parchment); stroke-width: 2; stroke-dasharray: 6 6; opacity: 0.7; pointer-events: none; }
.bonds:not(.is-linking) .bonds-rubber { display: none; }

/* ---------- Portraits ---------- */

.bonds-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.persona .bonds-node {
    position: absolute;
    display: block;
    width: 56px;
    height: 56px;
    margin: -28px 0 0 -28px;
    padding: 0;
    border-radius: 50%;
    border: 2px solid var(--c, var(--dp-parchment-dim));
    background: var(--dp-charcoal-3);
    box-shadow: 0 0 0 3px rgba(15, 14, 12, 0.85), 0 4px 14px rgba(0, 0, 0, 0.55);
    pointer-events: auto;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

/* The portrait is clipped to the circle: a zoomed framing (Persona editor) must not spill out. */
.bonds-node__img {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 50%;
}

.persona .bonds-node__img img {
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: cover;
    display: block;
}

.persona .bonds-node:hover,
.persona .bonds-node:focus-visible {
    z-index: 5;
    transform: scale(1.12);
    box-shadow: 0 0 0 3px rgba(15, 14, 12, 0.85), 0 0 18px var(--c, var(--dp-clay));
}

.bonds.is-editable:not(.is-linking) .bonds-node--entry { cursor: grab; }
.bonds.is-linking .bonds-node { cursor: crosshair; }

.persona .bonds-node--self {
    width: 108px;
    height: 108px;
    margin: -54px 0 0 -54px;
    border: 3px solid var(--dp-gold);
    box-shadow: 0 0 0 4px rgba(15, 14, 12, 0.9), 0 0 32px rgba(201, 163, 90, 0.35);
}

.persona .bonds-node--party {
    width: 68px;
    height: 68px;
    margin: -34px 0 0 -34px;
    border-color: var(--dp-clay-light);
}

.persona .bonds-node.is-picked {
    z-index: 6;
    box-shadow: 0 0 0 3px var(--dp-parchment), 0 0 24px var(--dp-parchment);
}

.persona .bonds-node.is-lifted { opacity: 0.25; }

.persona .bonds-node.is-dead .bonds-node__img img { filter: grayscale(1) brightness(0.62); }
.persona .bonds-node.is-dead { border-color: rgba(234, 223, 196, 0.35); }
.persona .bonds-node.is-missing .bonds-node__img img { filter: grayscale(0.6) sepia(0.3) brightness(0.8); }
.persona .bonds-node.is-missing { border-style: dashed; }

.bonds-node__mark {
    position: absolute;
    right: -4px;
    bottom: -4px;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--dp-night);
    border: 1px solid var(--dp-line-strong);
    font-size: 10px;
    color: var(--dp-parchment);
}

.persona .bonds-node.is-new::after {
    content: "";
    position: absolute;
    top: -2px;
    right: -2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--dp-ember);
    box-shadow: 0 0 0 2px var(--dp-night);
}

.bonds-node__name {
    position: absolute;
    top: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%) scale(min(2.2, max(1, var(--inv, 1))));
    transform-origin: 50% 0;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(15, 14, 12, 0.92);
    border: 1px solid var(--dp-line-strong);
    font-family: var(--dp-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    white-space: nowrap;
    color: var(--dp-parchment);
    pointer-events: none;
}

.bonds-node__name small {
    font-family: var(--dp-body);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--dp-parchment-dim);
}

.bonds-node__name .bonds-node__status { color: var(--dp-gold); text-transform: uppercase; letter-spacing: 0.1em; font-size: 9px; }

.bonds-node:hover .bonds-node__name,
.bonds-node:focus-visible .bonds-node__name { display: flex; }
.bonds.is-dragging .bonds-node__name { display: none !important; }

.persona .bonds-marker {
    position: absolute;
    scale: min(1.6, max(1, var(--inv, 1)));
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    background: var(--dp-night);
    border: 1.5px solid var(--c);
    font-size: 11px;
    color: var(--c);
    pointer-events: auto;
    cursor: default;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
}

.persona .bonds-marker[data-action] { cursor: pointer; }
.persona .bonds-marker[data-action]:hover { transform: scale(1.15); background: var(--c); color: var(--dp-night); }

.bonds-ghost {
    position: fixed;
    z-index: 10000;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--dp-parchment);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    pointer-events: none;
}

.bonds-ghost img { width: 100%; height: 100%; border: 0; object-fit: cover; }
.bonds-loose__img { overflow: hidden; }

/* ---------- Overlays on the viewport ---------- */

.bonds-banner {
    position: absolute;
    top: var(--dp-2);
    left: var(--dp-2);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 14px;
    border-radius: 999px;
    background: rgba(28, 26, 23, 0.92);
    border: 1px solid var(--dp-gold);
    font-size: 13px;
    white-space: nowrap;
    color: var(--dp-parchment);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
}

.bonds-banner > i { color: var(--dp-gold); }
.bonds-banner--link { border-color: var(--dp-clay-light); }
.bonds-banner--link > i { color: var(--dp-clay-light); }
.bonds-banner--quiet { border-color: var(--dp-line-strong); padding-right: 14px; color: var(--dp-parchment-dim); }
.bonds-banner--quiet > i { color: var(--dp-parchment-faint); }

.bonds-legend {
    position: absolute;
    left: var(--dp-2);
    bottom: var(--dp-2);
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--dp-radius);
    background: rgba(15, 14, 12, 0.72);
    border: 1px solid var(--dp-line);
    font-size: 12px;
    color: var(--dp-parchment-dim);
    pointer-events: none;
}

.bonds-legend__rings,
.bonds-legend__types {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    max-width: 280px;
}

.bonds-legend__rings b {
    display: inline-grid;
    place-items: center;
    width: 16px;
    height: 16px;
    margin-right: 5px;
    border-radius: 50%;
    border: 1px solid var(--dp-line-strong);
    font-size: 10px;
    color: var(--dp-parchment);
}

.bonds-legend__types span { display: inline-flex; align-items: center; gap: 5px; }
.bonds-legend__types i { color: var(--c); }

.bonds-zoom {
    position: absolute;
    right: var(--dp-2);
    bottom: var(--dp-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.persona .bonds-zoom .persona-icon-btn { background: rgba(15, 14, 12, 0.8); }

/* ---------- Drawer: people not on the wheel ---------- */

.bonds-drawer {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    padding: var(--dp-2);
    border-left: 1px solid var(--dp-line);
    background: rgba(28, 26, 23, 0.82);
    overflow-y: auto;
    transition: background 0.15s ease, box-shadow 0.15s ease;
}

.bonds-drawer.is-target {
    background: rgba(200, 69, 47, 0.14);
    box-shadow: inset 0 0 0 2px var(--dp-ember);
}

.bonds-drawer__head { display: flex; align-items: center; justify-content: space-between; }

.bonds-drawer__count {
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--dp-charcoal-3);
    font-size: 12px;
    text-align: center;
    color: var(--dp-parchment-dim);
}

.bonds-drawer__tip,
.bonds-drawer__hint {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    color: var(--dp-parchment-faint);
}

.bonds-drawer__hint { display: flex; gap: 8px; align-items: baseline; }

.persona .bonds-drawer__start { width: 100%; height: auto; min-height: 34px; padding: 8px 12px; white-space: normal; line-height: 1.3; justify-content: flex-start; text-align: left; }

.bonds-drawer__list { display: flex; flex-direction: column; gap: 6px; }

.bonds-loose {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 6px 6px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line);
    background: var(--dp-charcoal-2);
    cursor: pointer;
}

.bonds.is-editable .bonds-loose { cursor: grab; }
.bonds-loose:hover { border-color: var(--dp-clay); }
.bonds-loose.is-lifted { opacity: 0.3; }

.bonds-loose__img {
    position: relative;
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--dp-line-strong);
}

.bonds-loose__img img { width: 100%; height: 100%; border: 0; display: block; }
.bonds-loose.is-dead .bonds-loose__img img { filter: grayscale(1) brightness(0.65); }
.bonds-loose.is-missing .bonds-loose__img img { filter: grayscale(0.6) sepia(0.3); }
.bonds-loose.is-new .bonds-loose__img { box-shadow: 0 0 0 2px var(--dp-ember); }

.bonds-loose__name {
    display: flex;
    flex-direction: column;
    min-width: 0;
    font-size: 13px;
    line-height: 1.25;
    color: var(--dp-parchment);
}

.bonds-loose__name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--dp-parchment-faint); }

/* ---------- Timeline ---------- */

.bonds-timeline {
    display: flex;
    align-items: center;
    gap: var(--dp-2);
    padding: 10px var(--dp-3);
    border-top: 1px solid var(--dp-line);
    background: rgba(28, 26, 23, 0.9);
}

.bonds-timeline.is-empty { gap: 10px; font-size: 12px; color: var(--dp-parchment-faint); }

.bonds-track {
    position: relative;
    flex: 1;
    display: flex;
    align-items: flex-start;
    gap: 4px;
    overflow-x: auto;
    padding: 4px 2px 2px;
}

.bonds-track::before {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    top: 11px;
    height: 2px;
    background: linear-gradient(90deg, #4f7a8a, var(--dp-clay) 80%, var(--dp-ember));
    opacity: 0.6;
}

.persona .bonds-tick {
    position: relative;
    flex: 1 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
}

.bonds-tick__dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--dp-night);
    border: 2px solid var(--dp-parchment-faint);
    transform: rotate(45deg);
    border-radius: 3px;
    transition: transform 0.15s ease;
}

.bonds-tick__label {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    color: var(--dp-parchment-faint);
}

.persona .bonds-tick:hover .bonds-tick__dot { border-color: var(--dp-parchment); }
.persona .bonds-tick.is-active .bonds-tick__dot { background: var(--dp-gold); border-color: var(--dp-gold); transform: rotate(45deg) scale(1.2); }
.persona .bonds-tick.is-active .bonds-tick__label { color: var(--dp-parchment); }
.persona .bonds-tick--now .bonds-tick__label { font-family: var(--dp-display); letter-spacing: 0.1em; text-transform: uppercase; }

/* ---------- Popovers ---------- */

.bonds-pop {
    position: absolute;
    z-index: 20;
    width: 300px;
    padding: 12px;
    border-radius: 8px;
    background: var(--dp-charcoal);
    border: 1px solid var(--dp-line-strong);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
}

.bonds-form { display: flex; flex-direction: column; gap: 10px; }
.bonds-form .persona-eyebrow i { margin: 0 4px; }

.bonds-form input[type="text"] {
    height: 34px;
    padding: 0 10px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line-strong);
    background: var(--dp-night);
    font-family: var(--dp-body);
    font-size: 14px;
    color: var(--dp-parchment);
}

.bonds-form input[type="text"]:focus { outline: none; border-color: var(--dp-clay-light); box-shadow: none; }

.bonds-form__row { display: flex; align-items: center; gap: 6px; }
.bonds-form__spacer { flex: 1; }

.bonds-swatches { display: flex; flex-wrap: wrap; gap: 6px; }

.persona .bonds-swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3);
}

.persona .bonds-swatch.is-on { box-shadow: 0 0 0 2px var(--dp-charcoal), 0 0 0 4px var(--dp-parchment); }

.bonds-types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

.persona .bonds-type {
    justify-content: flex-start;
    height: 32px;
    padding: 0 10px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line);
    background: var(--dp-charcoal-2);
    font-size: 13px;
    color: var(--dp-parchment);
}

.persona .bonds-type i { width: 16px; color: var(--c); text-align: center; }
.persona .bonds-type:hover { border-color: var(--c); }
.persona .bonds-type.is-on { border-color: var(--c); background: var(--dp-charcoal-3); }

.persona .bonds-danger { color: #e58a74; }
.persona .bonds-danger:hover:not(:disabled) { border-color: var(--dp-ember); color: #f0a08b; }
.persona .persona-mini:disabled { opacity: 0.35; cursor: default; }

@media (max-width: 760px) {
    .bonds-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 150px; }
    .bonds-drawer { border-left: 0; border-top: 1px solid var(--dp-line); }
}

/* ==========================================================================
   Director: arrange by drag and drop (GM)
   ========================================================================== */

.persona-row.is-draggable { position: relative; cursor: grab; }
.persona-row.is-draggable:active { cursor: grabbing; }

.persona-row__grip {
    position: absolute;
    top: 24px;
    left: -15px;
    width: 12px;
    text-align: center;
    font-size: 11px;
    color: var(--dp-parchment-faint);
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
}

.persona-row.is-draggable:hover .persona-row__grip { opacity: 1; }

.persona-row.is-dragging,
.persona-section.is-dragging { opacity: 0.35; }

.persona-row.is-drop-before,
.persona-row.is-drop-after,
.persona .persona-folder.is-drop-before,
.persona .persona-folder.is-drop-after { position: relative; }

.persona-row.is-drop-before::before,
.persona-row.is-drop-after::after,
.persona .persona-folder.is-drop-before::before,
.persona .persona-folder.is-drop-after::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    border-radius: 2px;
    background: var(--dp-clay-light);
    box-shadow: 0 0 8px var(--dp-clay);
    pointer-events: none;
}

.persona-row.is-drop-before::before { top: -9px; }
.persona-row.is-drop-after::after { bottom: 7px; }
.persona .persona-folder.is-drop-before::before { top: -4px; }
.persona .persona-folder.is-drop-after::after { bottom: -4px; }

.persona .persona-folder.is-drop-into {
    background: var(--dp-clay-soft);
    border-bottom-color: var(--dp-clay-light);
    color: var(--dp-parchment);
}


.persona .persona-folder[data-drag-group] { cursor: grab; }
.persona.is-arranging,
.persona.is-arranging * { cursor: grabbing !important; user-select: none; }

.persona-drag-ghost {
    position: fixed;
    z-index: 10000;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 260px;
    padding: 6px 14px 6px 6px;
    transform: translate(12px, -50%);
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-clay-light);
    background: var(--dp-charcoal);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    font-family: var(--dp-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--dp-parchment);
    pointer-events: none;
}

.persona-drag-ghost img { width: 30px; height: 40px; object-fit: cover; border: 0; border-radius: 3px; }
.persona-drag-ghost i { color: var(--dp-clay-light); padding: 0 4px 0 8px; }
.persona-drag-ghost span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Drawer drop zones: shown while a portrait is being dragged. */
.bonds-newcat,
.bonds-takeoff {
    display: none;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    padding: 10px 12px;
    border: 1.5px dashed var(--dp-line-strong);
    border-radius: var(--dp-radius);
    font-size: 13px;
    line-height: 1.3;
    color: var(--dp-parchment-dim);
}

.bonds-newcat i { color: var(--dp-gold); font-size: 16px; }
.bonds-takeoff i { color: #e58a74; font-size: 15px; }
.bonds.is-dragging .bonds-newcat,
.bonds.is-dragging .bonds-takeoff { display: flex; }
.bonds-newcat.is-target { border-color: var(--dp-gold); background: rgba(201, 163, 90, 0.14); color: var(--dp-parchment); }
.bonds-drawer.is-target .bonds-takeoff { border-color: var(--dp-ember); color: var(--dp-parchment); }
.bonds-form__hint { margin: 0; font-size: 12px; line-height: 1.4; color: var(--dp-parchment-faint); }

/* ==========================================================================
   Bonds — header, focus mode, inspector
   ========================================================================== */

/* ---------- Header: whose wheel, players, tools ---------- */

.bonds-bar {
    gap: var(--dp-3);
    padding: 14px var(--dp-3);
}

.bonds-who {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
}

.bonds-who__img {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--dp-gold);
    box-shadow: 0 0 0 3px rgba(201, 163, 90, 0.15);
}

.bonds-who__img img { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }

.bonds-who__text h2 {
    margin: 0;
    border: 0;
    font-family: var(--dp-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.03em;
    line-height: 1.15;
    color: var(--dp-parchment);
}

.bonds-who__text p {
    margin: 3px 0 0;
    max-width: 52ch;
    font-size: 13px;
    line-height: 1.35;
    color: var(--dp-parchment-faint);
}

.bonds-players {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(15, 14, 12, 0.6);
    border: 1px solid var(--dp-line);
}

.persona .bonds-player {
    gap: 8px;
    height: 40px;
    padding: 3px;
    border-radius: 999px;
    color: var(--dp-parchment-dim);
    transition: background 0.15s ease;
}

.bonds-player__img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid var(--dp-line-strong);
    filter: saturate(0.6) brightness(0.85);
    transition: filter 0.15s ease, border-color 0.15s ease;
}

.bonds-player__img img { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.bonds-player__name { display: none; padding-right: 12px; font-family: var(--dp-display); font-size: 13px; font-weight: 600; white-space: nowrap; }

.persona .bonds-player:hover .bonds-player__img { filter: none; border-color: var(--dp-parchment-dim); }
.persona .bonds-player.is-active { background: var(--dp-charcoal-3); color: var(--dp-parchment); }
.persona .bonds-player.is-active .bonds-player__img { filter: none; border-color: var(--dp-gold); }
.persona .bonds-player.is-active .bonds-player__name { display: inline; }

/* ---------- Portraits: bigger, clearer states ---------- */

.persona .bonds-node {
    width: 62px;
    height: 62px;
    margin: -31px 0 0 -31px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, filter 0.2s ease;
}

.persona .bonds-node--self {
    width: 116px;
    height: 116px;
    margin: -58px 0 0 -58px;
}

.persona .bonds-node--party {
    width: 76px;
    height: 76px;
    margin: -38px 0 0 -38px;
}

.persona .bonds-node.is-selected {
    z-index: 7;
    transform: scale(1.14);
    box-shadow: 0 0 0 3px var(--dp-night), 0 0 0 5px var(--dp-gold), 0 0 28px rgba(201, 163, 90, 0.55);
}

.persona .bonds-node--self.is-selected { transform: none; }

/* Focus: a person and their web of bonds; everything else steps back. */
.bonds.has-focus .bonds-node:not(.is-near),
.bonds.has-focus .bonds-marker:not(.is-near) { opacity: 0.22; filter: grayscale(0.7); }
.bonds.has-focus .bonds-link { stroke-opacity: 0.08; }
.bonds.has-focus .bonds-link.is-near { stroke-opacity: 1; stroke-width: 3.5; }
.bonds.has-focus .bonds-sector { fill-opacity: 0.55; }
.bonds-link { transition: stroke-opacity 0.2s ease; }

.bonds-sector-label { font-size: 18px; }

/* ---------- Drawer: list mode ---------- */

.bonds-drawer { width: auto; gap: 12px; padding: var(--dp-2); }
.bonds-main { grid-template-columns: minmax(0, 1fr) 288px; }

.bonds-search {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line-strong);
    background: var(--dp-night);
    color: var(--dp-parchment-faint);
}

.bonds-search input {
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0;
    border: 0;
    background: none;
    box-shadow: none;
    font-family: var(--dp-body);
    font-size: 14px;
    color: var(--dp-parchment);
}

.bonds-search input:focus { outline: none; box-shadow: none; }
.bonds-search:focus-within { border-color: var(--dp-clay-light); }

.bonds-drawer__list { gap: 2px; }

.bonds-loose {
    padding: 6px 8px;
    border: 1px solid transparent;
    background: transparent;
}

.bonds-loose:hover { border-color: transparent; background: var(--dp-charcoal-2); }
.bonds-loose[hidden] { display: none; }
.bonds-loose__img { width: 36px; height: 36px; }

.persona .bonds-drawer__start {
    background: transparent;
    border: 1px dashed var(--dp-line-strong);
    color: var(--dp-parchment-dim);
    font-weight: 500;
}

.persona .bonds-drawer__start:hover { border-color: var(--dp-clay); background: var(--dp-clay-soft); color: var(--dp-parchment); }

/* ---------- Drawer: inspector ---------- */

.bonds-inspector { gap: var(--dp-2); }

.persona .bonds-back {
    align-self: flex-start;
    gap: 8px;
    padding: 4px 0;
    font-size: 13px;
    color: var(--dp-parchment-faint);
}

.persona .bonds-back:hover { color: var(--dp-parchment); }

.bonds-insp__head {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-bottom: var(--dp-2);
    border-bottom: 1px solid var(--dp-line);
    text-align: center;
}

.bonds-insp__portrait {
    width: 112px;
    height: 112px;
    margin-bottom: 6px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--dp-clay-light);
    box-shadow: 0 0 0 4px var(--dp-charcoal), 0 0 0 5px var(--dp-line-strong), 0 12px 30px rgba(0, 0, 0, 0.5);
}

.bonds-insp__portrait.self { border-color: var(--dp-gold); }
.bonds-insp__portrait img { width: 100%; height: 100%; border: 0; display: block; }
.bonds-insp__head.is-dead .bonds-insp__portrait img { filter: grayscale(1) brightness(0.65); }
.bonds-insp__head.is-missing .bonds-insp__portrait img { filter: grayscale(0.6) sepia(0.3); }

.bonds-insp__head h3 {
    margin: 0;
    border: 0;
    font-family: var(--dp-display);
    font-size: 19px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--dp-parchment);
}

.bonds-insp__title { margin: 0; font-style: italic; font-size: 14px; color: var(--dp-parchment-dim); }
.bonds-insp__tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 4px; }

.bonds-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--dp-charcoal-3);
    font-size: 12px;
    color: var(--dp-parchment-dim);
}

.bonds-tag.is-dead { color: var(--dp-parchment); background: rgba(234, 223, 196, 0.1); }
.bonds-tag.is-missing { color: var(--dp-gold); background: rgba(201, 163, 90, 0.15); }

.bonds-insp__block { display: flex; flex-direction: column; gap: 8px; }

.bonds-insp__label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--dp-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dp-parchment-dim);
}

.bonds-insp__label b {
    min-width: 18px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--dp-charcoal-3);
    font-family: var(--dp-body);
    font-size: 11px;
    text-align: center;
}

.bonds-insp__value, .bonds-insp__empty { margin: 0; font-size: 13px; line-height: 1.45; color: var(--dp-parchment-faint); }

.bonds-seg {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 3px;
    border-radius: var(--dp-radius);
    background: var(--dp-night);
    border: 1px solid var(--dp-line);
}

.persona .bonds-seg button {
    height: 30px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--dp-parchment-dim);
}

.persona .bonds-seg button:hover { color: var(--dp-parchment); }
.persona .bonds-seg button.is-on { background: var(--dp-clay); color: var(--dp-night); font-weight: 600; }

.bonds-bonds { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }

.bonds-bond {
    display: flex;
    align-items: center;
    gap: 4px;
    border-radius: var(--dp-radius);
    border-left: 2px solid var(--c);
    background: var(--dp-charcoal-2);
}

.persona .bonds-bond__who {
    flex: 1;
    justify-content: flex-start;
    gap: 10px;
    min-width: 0;
    padding: 6px 8px;
    text-align: left;
}

.bonds-bond__img { flex: none; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; }
.bonds-bond__img img { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.bonds-bond__text { display: flex; flex-direction: column; min-width: 0; }
.bonds-bond__text b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; font-size: 13px; color: var(--dp-parchment); }
.bonds-bond__text small { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--c); }
.persona .bonds-bond__who:hover b { text-decoration: underline; }

.persona .bonds-bond__edit {
    flex: none;
    width: 30px;
    height: 30px;
    margin-right: 4px;
    border-radius: 4px;
    color: var(--dp-parchment-faint);
}

.persona .bonds-bond__edit:hover { background: var(--dp-charcoal-3); color: var(--dp-parchment); }

.bonds-insp__actions { display: grid; gap: 8px; }
.persona .bonds-insp__actions .persona-button { width: 100%; }

.persona .bonds-ghost-btn {
    background: transparent;
    border: 1px solid var(--dp-line-strong);
    color: var(--dp-parchment);
    font-weight: 500;
}

.persona .bonds-ghost-btn:hover { background: var(--dp-charcoal-3); border-color: var(--dp-parchment-faint); }

.persona .bonds-takeoff-btn {
    align-self: center;
    gap: 8px;
    margin-top: auto;
    padding: 6px 4px;
    font-size: 13px;
    color: var(--dp-parchment-faint);
}

.persona .bonds-takeoff-btn:hover { color: #e58a74; }

/* The legend only explains the link icons; distance lives in the inspector. */
.bonds-legend { padding: 8px 12px; }

/* ---------- Big wheels: finder, hide the dead, dense links ---------- */

.bonds-finder {
    position: absolute;
    top: var(--dp-2);
    right: var(--dp-2);
    z-index: 4;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.bonds-search--wheel { width: 220px; background: rgba(15, 14, 12, 0.85); }

.bonds-finder__results {
    position: absolute;
    top: 40px;
    left: 0;
    width: 220px;
    padding: 4px;
    border-radius: var(--dp-radius);
    border: 1px solid var(--dp-line-strong);
    background: var(--dp-charcoal);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
}

.bonds-finder__results[hidden] { display: none; }

.persona .bonds-finder__results button {
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    width: 100%;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--dp-parchment);
}

.persona .bonds-finder__results button:hover { background: var(--dp-charcoal-3); }
.bonds-finder__results img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 0; }
.persona .bonds-finder .persona-mini { height: 34px; background: rgba(15, 14, 12, 0.85); }

/* Many links: icons only show for the person in focus. */
.bonds.is-dense .bonds-marker:not(.is-near) { display: none; }
.bonds.is-dense .bonds-link { stroke-opacity: 0.35; }
.bonds.is-dense.has-focus .bonds-link:not(.is-near) { stroke-opacity: 0.05; }

/* ==========================================================================
   Bonds — party ring, changes, suspicion, official links, in scene
   ========================================================================== */

/* Party: engraved band, gold thread, name plates always on. */
.bonds-party-band { stroke: rgba(180, 100, 62, 0.12); }
.bonds-party-etch { opacity: 0.9; }
.bonds-party-thread { fill: none; stroke: var(--dp-gold); stroke-width: 1.5; stroke-opacity: 0.55; stroke-dasharray: 2 6; stroke-linecap: round; }

/* Party and self names: on hover, like everyone else's (styled as plates). */
.bonds-node--party .bonds-node__name,
.bonds-node--self .bonds-node__name {
    top: calc(100% - 8px);
    padding: 2px 10px;
    border-color: rgba(201, 163, 90, 0.45);
    font-size: 11px;
    letter-spacing: 0.04em;
}

.bonds-node--self .bonds-node__name { top: calc(100% - 10px); border-color: var(--dp-gold); font-size: 12px; }
.bonds-node--party:hover .bonds-node__name small,
.bonds-node--self .bonds-node__name small { display: none; }

/* Changed since last time: a soft ember halo until acknowledged. */
.persona .bonds-node.is-changed { box-shadow: 0 0 0 3px var(--dp-night), 0 0 0 5px var(--dp-ember), 0 0 22px rgba(200, 69, 47, 0.6); }

@media (prefers-reduced-motion: no-preference) {
    .persona .bonds-node.is-changed { animation: bonds-halo 2.4s ease-in-out infinite; }
    @keyframes bonds-halo { 50% { box-shadow: 0 0 0 3px var(--dp-night), 0 0 0 5px var(--dp-ember), 0 0 6px rgba(200, 69, 47, 0.2); } }
}

.bonds-changes {
    position: absolute;
    top: var(--dp-2);
    left: var(--dp-2);
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 280px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid rgba(200, 69, 47, 0.55);
    background: rgba(28, 26, 23, 0.94);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}

.bonds-changes__text { display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.4; color: var(--dp-parchment-dim); }
.bonds-changes__text b { font-family: var(--dp-display); font-size: 14px; font-weight: 600; color: var(--dp-parchment); }
.bonds-changes__faces { display: flex; align-items: center; gap: 6px; }

.persona .bonds-changes__face {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid var(--dp-ember);
}

.bonds-changes__face img { width: 100%; height: 100%; border: 0; display: block; }
.bonds-changes__face.is-dead img { filter: grayscale(1) brightness(0.65); }
.bonds-changes__more { font-size: 12px; color: var(--dp-parchment-faint); }
.persona .bonds-changes .persona-mini { align-self: flex-start; }

/* Suspicion: dashed. Official: inked casing and a seal. Hidden (GM): faded. */
.bonds-link.is-suspect { stroke-dasharray: 7 7; }
.bonds-link-casing { fill: none; stroke: rgba(15, 14, 12, 0.85); stroke-width: 7; stroke-linecap: round; }
.bonds-link.is-official { stroke-width: 3; }
.bonds-link.is-hidden, .bonds-link-casing.is-hidden { stroke-opacity: 0.35; }
.bonds.has-focus .bonds-link-casing:not(.is-near) { stroke-opacity: 0.05; }

.persona .bonds-marker.is-suspect { border-style: dashed; }
.persona .bonds-marker.is-official { border-width: 2px; box-shadow: 0 0 0 2px var(--dp-night), 0 0 0 3px var(--dp-gold); }
.persona .bonds-marker.is-hidden { opacity: 0.5; }

.bonds-marker__badge {
    position: absolute;
    top: -7px;
    right: -7px;
    display: grid;
    place-items: center;
    min-width: 14px;
    height: 14px;
    border-radius: 999px;
    background: var(--dp-night);
    border: 1px solid var(--c);
    font-size: 9px;
    font-weight: 700;
    line-height: 1;
    color: var(--dp-parchment);
}

.bonds-marker__badge.is-seal { border-color: var(--dp-gold); color: var(--dp-gold); font-size: 7px; }

/* Link form */
.bonds-form--link { width: 100%; }
.bonds-pop:has(.bonds-form--link) { width: 340px; }

.bonds-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--dp-radius);
    background: var(--dp-charcoal-2);
    font-size: 12px;
    line-height: 1.4;
    color: var(--dp-parchment-faint);
    cursor: pointer;
}

.bonds-check input { margin: 2px 0 0; accent-color: var(--dp-clay); }
.bonds-check span { display: flex; flex-direction: column; gap: 1px; }
.bonds-check b { font-weight: 600; font-size: 13px; color: var(--dp-parchment); }
.persona .bonds-form button[type="submit"]:disabled { opacity: 0.4; cursor: default; }

/* Inspector bond rows */
.bonds-bond.is-suspect { border-left-style: dashed; }
.bonds-bond__text small { flex-wrap: wrap; }
.bonds-bond__text em { margin-top: 2px; font-size: 12px; line-height: 1.35; color: var(--dp-parchment-dim); white-space: normal; }

.bonds-flag {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-left: 4px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--dp-charcoal-3);
    font-size: 10px;
    font-style: normal;
    color: var(--dp-parchment-dim);
}

.bonds-flag.is-official { color: var(--dp-gold); }

/* In scene */
.persona .bonds-scene.is-on { background: var(--dp-clay); border-color: var(--dp-clay); color: var(--dp-night); }
.bonds-loose__scene { margin-left: auto; font-size: 12px; color: var(--dp-clay-light); }

/* Party plates sit on the outer side of each companion, away from the centre. */
.bonds-node--party.is-upper .bonds-node__name { top: auto; bottom: calc(100% - 8px); transform-origin: 50% 100%; }

/* ==========================================================================
