   Bonds — narrow screens (phones, a squeezed window)
   ========================================================================== */

@media (max-width: 760px) {
    .bonds { grid-template-rows: auto minmax(0, 1fr) auto; }
    .bonds-bar { gap: 10px; padding: 10px 12px; }
    .bonds-who { gap: 10px; flex: 1 1 100%; }
    .bonds-who__img { width: 38px; height: 38px; }
    .bonds-who__text h2 { font-size: 17px; }
    .bonds-who__text p { display: none; }
    .bonds-players { max-width: 100%; overflow-x: auto; }
    .bonds-bar__tools { margin-left: 0; }

    .bonds-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(320px, 68%) minmax(0, 1fr); }
    .bonds-drawer { border-left: 0; border-top: 1px solid var(--dp-line); }

    .bonds-finder { left: 8px; right: 8px; top: 8px; flex-wrap: wrap; }
    .bonds-search--wheel { flex: 1; width: auto; min-width: 120px; }
    .bonds-finder__results { width: 100%; }

    .bonds-changes { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; padding: 10px 12px; gap: 8px; }
    .bonds-legend { display: none; }
    .bonds-zoom { right: 8px; bottom: 8px; flex-direction: row; }
    .bonds-finder .persona-mini span { display: none; }
    .bonds-changes__faces { display: none; }
    .bonds-changes ~ .bonds-zoom { bottom: auto; top: 56px; }

    .bonds-pop { width: auto !important; left: 8px !important; right: 8px; max-height: 70%; overflow-y: auto; }
    .bonds-insp__portrait { width: 84px; height: 84px; }
    .bonds-timeline { padding: 8px 12px; }
    .bonds-timeline > .persona-eyebrow { display: none; }
}

/* ==========================================================================
   Bonds — live moments: a reveal arrives, a death fades
   ========================================================================== */

@media (prefers-reduced-motion: no-preference) {
    /* Someone just revealed: flies into the list with an ember glow. */
    .bonds-loose.is-arriving { animation: bonds-arrive 1.1s cubic-bezier(0.2, 0.9, 0.25, 1.15) both, bonds-arrive-glow 2.8s ease-out 0.6s both; }
    .persona .bonds-node.is-arriving { animation: bonds-arrive-node 1s cubic-bezier(0.2, 0.9, 0.25, 1.2) both; }

    @keyframes bonds-arrive {
        from { opacity: 0; transform: translateX(60px) scale(0.92); }
        to { opacity: 1; transform: none; }
    }
    @keyframes bonds-arrive-glow {
        0% { box-shadow: 0 0 0 1px var(--dp-ember), 0 0 26px rgba(200, 69, 47, 0.7); background: rgba(200, 69, 47, 0.18); }
        100% { box-shadow: none; background: transparent; }
    }
    @keyframes bonds-arrive-node {
        from { opacity: 0; transform: scale(0.3); }
        to { opacity: 1; transform: none; }
    }

    /* Someone just died: colour drains away, a pale flash, the skull sets in. */
    .persona .bonds-node.is-dying .bonds-node__img img { animation: bonds-drain 2.6s ease-in both; }
    .persona .bonds-node.is-dying { animation: bonds-death-flash 2.6s ease-out both; }
    .persona .bonds-node.is-dying .bonds-node__mark { animation: bonds-mark-in 0.6s ease-out 1.8s both; }
    .bonds-loose.is-dying .bonds-loose__img img { animation: bonds-drain 2.6s ease-in both; }

    @keyframes bonds-drain {
        0% { filter: none; }
        35% { filter: brightness(1.6) saturate(0.6); }
        100% { filter: grayscale(1) brightness(0.62); }
    }
    @keyframes bonds-death-flash {
        0% { box-shadow: 0 0 0 3px rgba(15, 14, 12, 0.85); }
        30% { box-shadow: 0 0 0 3px rgba(15, 14, 12, 0.85), 0 0 0 10px rgba(234, 223, 196, 0.25), 0 0 60px rgba(234, 223, 196, 0.6); }
        100% { box-shadow: 0 0 0 3px rgba(15, 14, 12, 0.85), 0 4px 14px rgba(0, 0, 0, 0.55); }
    }
    @keyframes bonds-mark-in {
        from { opacity: 0; transform: scale(2.4); }
        to { opacity: 1; transform: none; }
    }

    /* Someone just went missing: fades out of focus. */
    .persona .bonds-node.is-vanishing .bonds-node__img img { animation: bonds-vanish 2.2s ease-in-out both; }
    .persona .bonds-node.is-vanishing .bonds-node__mark { animation: bonds-mark-in 0.6s ease-out 1.4s both; }
    @keyframes bonds-vanish {
        0% { filter: none; opacity: 1; }
        50% { filter: blur(3px) grayscale(0.4); opacity: 0.4; }
        100% { filter: grayscale(0.6) sepia(0.3) brightness(0.8); opacity: 1; }
    }
}

/* ==========================================================================
   Bonds — pins, archive, the party's view, moments, overview
   ========================================================================== */

/* Distance colours, shared by every "Close / Known / Distant" chip. */
.is-ring1 { --ring: #c9a35a; }
.is-ring2 { --ring: #b4643e; }
.is-ring3 { --ring: #7d7466; }

/* Pins: a gold star on the portrait, a strip at the top of the list. */
.bonds-node__pin {
    position: absolute;
    top: -6px;
    left: -6px;
    display: none;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--dp-night);
    border: 1px solid var(--dp-gold);
    font-size: 9px;
    color: var(--dp-gold);
}

.bonds-node.is-pinned .bonds-node__pin { display: grid; }

.persona .bonds-pin {
    display: inline-grid;
    place-items: center;
    width: 26px;
    height: 26px;
    margin-left: 6px;
    vertical-align: 2px;
    border-radius: 50%;
    font-size: 13px;
    color: var(--dp-parchment-faint);
}

.persona .bonds-pin:hover, .persona .bonds-pin.is-on { color: var(--dp-gold); }

.bonds-pins { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--dp-line); }
.bonds-pins .bonds-insp__label i { color: var(--dp-gold); }
.bonds-pins__row { display: flex; flex-wrap: wrap; gap: 6px; }

.persona .bonds-pins__face {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid var(--dp-gold);
}

.bonds-pins__face img { width: 100%; height: 100%; border: 0; display: block; }
.bonds-pins__face.is-dead img { filter: grayscale(1) brightness(0.65); }

/* Archive */
.bonds-archive { border-top: 1px solid var(--dp-line); padding-top: 10px; }

.bonds-archive summary {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: var(--dp-display);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dp-parchment-faint);
    list-style: none;
}

.bonds-archive summary::-webkit-details-marker { display: none; }
.bonds-archive summary b { padding: 0 6px; border-radius: 999px; background: var(--dp-charcoal-3); font-family: var(--dp-body); font-size: 11px; }
.bonds-archive[open] summary { margin-bottom: 8px; color: var(--dp-parchment-dim); }
.persona .bonds-loose--archived { width: 100%; justify-content: flex-start; opacity: 0.75; }
.bonds-loose--archived .bonds-loose__img img { filter: grayscale(0.5); }

.bonds-insp__minor { display: flex; justify-content: center; gap: var(--dp-2); margin-top: auto; }
.bonds-insp__minor .bonds-takeoff-btn { margin-top: 0; }

/* What the party thinks */
.bonds-peers { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.bonds-peers li { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dp-parchment); }
.bonds-peers__img { flex: none; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1px solid var(--dp-line-strong); }
.bonds-peers__img img { width: 100%; height: 100%; object-fit: cover; border: 0; display: block; }
.bonds-peers__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.bonds-peers__ring {
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--ring);
    font-size: 11px;
    color: var(--ring);
}

/* Moments: what changed, and who */
.persona .bonds-node.is-moved { box-shadow: 0 0 0 3px var(--dp-night), 0 0 0 5px var(--dp-gold), 0 0 18px rgba(201, 163, 90, 0.45); }

.bonds-banner--moment {
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    max-width: 360px;
    padding: 8px 10px 10px 14px;
    border-radius: 10px;
    white-space: normal;
}

.bonds-banner__row { display: flex; align-items: center; gap: 10px; }
.bonds-banner__row > i { color: var(--dp-gold); }
.bonds-banner__diff { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 6px 0 0; border-top: 1px solid var(--dp-line); list-style: none; font-size: 12px; color: var(--dp-parchment-dim); }
.bonds-banner__diff i { width: 14px; color: var(--dp-gold); text-align: center; }
.bonds-banner__diff .is-more, .bonds-banner__none { margin: 0; font-size: 12px; color: var(--dp-parchment-faint); }
.bonds-tick.is-auto .bonds-tick__dot { border-style: dotted; }

/* GM overview */
.bonds-ov { display: flex; flex-direction: column; min-height: 0; padding: var(--dp-2) var(--dp-3); gap: var(--dp-2); overflow: hidden; }
.bonds-ov__bar { display: flex; align-items: center; gap: var(--dp-2); flex-wrap: wrap; }
.bonds-ov__bar .bonds-search { width: 260px; }
.bonds-ov__bar p { margin: 0; max-width: 60ch; font-size: 13px; color: var(--dp-parchment-faint); }
.bonds-ov__scroll { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--dp-line); border-radius: 8px; }

.bonds-ov__table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.bonds-ov__table thead th { position: sticky; top: 0; z-index: 2; padding: 10px 8px; background: var(--dp-charcoal); border-bottom: 1px solid var(--dp-line-strong); }
.bonds-ov__table tbody th { position: sticky; left: 0; z-index: 1; background: var(--dp-charcoal-2); text-align: left; font-weight: 400; }
.bonds-ov__table th, .bonds-ov__table td { padding: 6px 8px; border-bottom: 1px solid var(--dp-line); }
.bonds-ov__table td { text-align: center; }
.bonds-ov__table tr[hidden] { display: none; }
.bonds-ov__table tbody tr:hover td, .bonds-ov__table tbody tr:hover th { background: var(--dp-charcoal-3); }

.bonds-ov__player { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--dp-display); font-size: 12px; font-weight: 600; color: var(--dp-parchment); }
.bonds-ov__player img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--dp-line-strong); }

.bonds-ov__who { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.bonds-ov__who b { display: block; font-weight: 500; color: var(--dp-parchment); }
.bonds-ov__who small { display: block; font-size: 11px; color: var(--dp-parchment-faint); }
.bonds-ov__img { flex: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; }
.bonds-ov__img img { width: 100%; height: 100%; border: 0; display: block; }
.bonds-ov__who.is-dead .bonds-ov__img img { filter: grayscale(1) brightness(0.65); }

.bonds-ov__table td.is-unknown { color: var(--dp-parchment-faint); opacity: 0.4; font-size: 11px; }

.persona .bonds-ov__cell {
    gap: 6px;
    min-width: 92px;
    height: 28px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--ring, var(--dp-line-strong));
    color: var(--ring, var(--dp-parchment-faint));
    font-size: 12px;
}

.persona .bonds-ov__cell:not(.is-ring1):not(.is-ring2):not(.is-ring3) { border-style: dashed; }
.persona .bonds-ov__cell.is-archived { opacity: 0.55; }
.persona .bonds-ov__cell .fa-star { color: var(--dp-gold); font-size: 10px; }
.persona .bonds-ov__cell small { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--dp-parchment-faint); }
.persona .bonds-ov__cell:hover { background: var(--dp-charcoal-3); }

.bonds .bonds-ov { grid-row: 2; }

/* Lines only for the person in focus (a viewer's choice). */
.bonds.is-lines-focus .bonds-link:not(.is-near),
.bonds.is-lines-focus .bonds-link-casing:not(.is-near),
.bonds.is-lines-focus .bonds-marker:not(.is-near) { visibility: hidden; }

/* Link style panel */
.bonds-pop:has(.bonds-form--style) { width: 280px; }
.bonds-range { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dp-parchment-dim); }
.bonds-range.is-off { opacity: 0.4; }
.bonds-range input[type="range"] { width: 100%; accent-color: var(--dp-clay); }
.bonds-range__ends { display: flex; justify-content: space-between; color: var(--dp-parchment-faint); }

/* Preview chrome (not part of the module) */
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #0b0a09; }
body { font-family: var(--dp-body); color: var(--dp-parchment); }
.pv { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.pv-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: #151310; border-bottom: 1px solid var(--dp-line); font-size: 13px; }
.pv-bar b { font-family: var(--dp-display); letter-spacing: .08em; }
.pv-bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--dp-parchment-dim); }
.pv-bar select, .pv-bar button { font: inherit; background: var(--dp-charcoal-2); color: var(--dp-parchment); border: 1px solid var(--dp-line-strong); border-radius: 4px; padding: 4px 8px; }
.pv-bar button { cursor: pointer; }
.pv-note { margin-left: auto; color: var(--dp-parchment-faint); font-size: 12px; }
.pv-stage { padding: 16px; min-height: 0; }
.pv-window { height: 100%; max-width: 1180px; margin: 0 auto; border: 1px solid var(--dp-line-strong); border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: 30px minmax(0, 1fr); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.pv-titlebar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #23201c; font-family: var(--dp-display); font-size: 13px; color: var(--dp-parchment-dim); }
.pv-card { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,9,8,.72); z-index: 50; }
.pv-card[hidden] { display: none; }
.pv-card article { display: grid; grid-template-columns: 220px 300px; background: var(--dp-charcoal); border: 1px solid var(--dp-line-strong); border-radius: 10px; overflow: hidden; }
.pv-card img { width: 220px; height: 290px; object-fit: cover; display: block; }
.pv-card .body { padding: 20px; }
.pv-card h3 { margin: 4px 0; font-family: var(--dp-display); font-size: 22px; border: 0; }
.pv-card p { color: var(--dp-parchment-dim); font-size: 14px; }
@media (max-width: 760px) {
  .pv-bar { gap: 6px 10px; padding: 8px 10px; font-size: 12px; }
  .pv-bar b, .pv-note, .pv-bar label:nth-of-type(2), #pv-reset { display: none; }
  .pv-stage { padding: 0; }
  .pv-window { border: 0; border-radius: 0; grid-template-rows: minmax(0, 1fr); }
  .pv-titlebar { display: none; }
  .pv-card article { grid-template-columns: 1fr; width: calc(100vw - 32px); }
  .pv-card img { width: 100%; height: 240px; }
}

Drawn as a dashed line.","Official":"Official","OfficialHint":"Shows on every wheel that knows both people. Players can't change it.","HiddenShort":"Hidden","HiddenHint":"Only you see it, until you untick this.","NotePlaceholder":"Why? (optional, e.g. owes us 50 gold)","SinceLast":"Since you last looked","GotIt":"Got it","ChangeNew1":"{n} new person","ChangeNew":"{n} new people","ChangeDead1":"{n} death","ChangeDead":"{n} deaths","ChangeStatus1":"{n} went missing or came back","ChangeStatus":"{n} went missing or came back","ChangeLinks1":"{n} new revealed bond","ChangeLinks":"{n} new revealed bonds","InScene":"In scene ({n})","InSceneHint":"Only the people with a token on the current scene","Export":"Save the wheel as an image","ExportFailed":"Couldn't save the image: a portrait comes from another site that doesn't allow it.","Overview":"Overview","OverviewHint":"Every person the players know, and where each player keeps them. Click a cell to open that wheel on that person.","OverviewEmpty":"No one has been revealed to the players yet.","OvUnknown":"Not revealed to this player","OvNotPlaced":"Not placed","Archived":"Archived","Archive":"Archive","ArchiveHint":"Takes them off the wheel and out of the list, but keeps them in the timeline.","Restore":"Restore","Pin":"Pin","Unpin":"Unpin","Pinned":"Pinned","PartyThinks":"What the party thinks","NoChangesInMoment":"Nothing changed on this wheel in this moment.","DiffDied":"{name} died","DiffMissing":"{name} went missing","DiffAdded":"{name} joined the wheel","AutoSession":"Session {n} · {date}","AutoCombat":"After the fight · {scene}","LinkStyle":"Link style","ShapeCurve":"Curved","ShapeAngular":"Angular","Bend":"How much curves bend","BendStraight":"Straight","BendLoose":"Loose","ShowLines":"Show lines","ShowAlways":"Always","ShowFocus":"Only in focus","LinkStyleHint":"Only for you. Angular lines follow the rings of the wheel. With 'only in focus', a person's lines show when you hover or select them."},"Arrange":{"Moved /**
 * Bonds — each player's relationship wheel, inspired by the "People" screen of Final Fantasy XVI.
 *
 * Pure data and geometry: no Foundry globals here, so the same code runs in the module,
 * in the standalone preview and in tests.
 *
 * A player's wheel (stored in their own user flags):
 *   { v, sectors: [{ id, label, color }], placements: [{ id, sector, ring }], links: [{ id, a, b, type }] }
 * - Slices are derived, never empty: by default a person sits in the slice of their Persona folder
 *   (the GM's tags), and a slice exists only while someone is in it.
 * - sectors: the player's own categories ("don't trust"…). A person moved into one keeps
 *   `placement.sector` = its id; otherwise `sector` is null (= their folder's slice).
 *   A category with nobody in it is dropped.
 * - placements: a known person (Persona entry id) at a distance ring (1 close … 3 distant).
 *   The order of the array is the order inside each slice and ring.
 * - links: a relation between two portraits. Node ids are entry ids, "self" or "u:<userId>" (party).
 *   `note`: one line of why ("owes us 50 gold"); `suspect`: the player thinks so but isn't sure.
 * Official links (GM, world data) use the same shape between two people, plus `hidden`.
 * Everything is an array so a Foundry flag update replaces it whole (objects would be merged).
 */

const SELF = "self";
const PARTY_PREFIX = "u:";

const RINGS = [1, 2, 3];

const STATUSES = ["alive", "dead", "missing"];

const LINK_TYPES = [
    { id: "ally", icon: "fa-solid fa-handshake", color: "#8fa35a", directed: false },
    { id: "family", icon: "fa-solid fa-house", color: "#d9c79e", directed: false },
    { id: "love", icon: "fa-solid fa-heart", color: "#d0708f", directed: false },
    { id: "rival", icon: "fa-solid fa-bolt", color: "#c9a35a", directed: false },
    { id: "enemy", icon: "fa-solid fa-burst", color: "#d4553c", directed: false },
    { id: "serves", icon: "fa-solid fa-crown", color: "#d68a5c", directed: true },
    { id: "betrayed", icon: "fa-solid fa-heart-crack", color: "#a33a2a", directed: true }
];

/** Slice colours: Embermark tones, readable on the dark wheel. */
const SECTOR_COLORS = ["#b4643e", "#74864a", "#4f7a8a", "#8a5a8f", "#c9a35a", "#c8452f", "#5d6b9a", "#857a65"];

/** Logical canvas, scaled to fit the window. */
const GEOMETRY = {
    size: 1000,
    center: 500,
    selfRadius: 54,
    partyRadius: 132,
    partyBand: [92, 172],
    ringBands: [[180, 272], [272, 364], [364, 456]],
    labelRadius: 478,
    nodeArc: 74,          // arc length one portrait needs on its ring
    laneWidth: 70,        // extra depth a ring gains for each lane when it fills up
    minSector: 0.42,      // radians
    gap: 0.035            // radians between slices
};

const uid = () => Math.random().toString(36).slice(2, 12);
const clampRing = ring => Math.min(3, Math.max(1, Math.round(Number(ring) || 2)));

/* -------------------------------------------- */
/*  Normalizing                                 */
/* -------------------------------------------- */

function emptyBonds() {
    return { v: 1, sectors: [], placements: [], links: [], pins: [], archived: [] };
}

function normalizeBonds(raw) {
    const out = emptyBonds();
    if (!raw || typeof raw !== "object") return out;
    const sectors = [];
    const sectorIds = new Set();
    for (const s of Array.isArray(raw.sectors) ? raw.sectors : []) {
        if (!s?.id || sectorIds.has(s.id)) continue;
        sectorIds.add(s.id);
        sectors.push({
            id: String(s.id),
            label: String(s.label ?? "").slice(0, 60),
            color: /^#[0-9a-f]{6}$/i.test(s.color) ? s.color : SECTOR_COLORS[sectors.length % SECTOR_COLORS.length]
        });
    }
    const placed = new Set();
    for (const p of Array.isArray(raw.placements) ? raw.placements : []) {
        if (!p?.id || placed.has(p.id)) continue;
        placed.add(p.id);
        out.placements.push({ id: String(p.id), sector: sectorIds.has(p.sector) ? String(p.sector) : null, ring: clampRing(p.ring) });
    }
    // Pinned people (shown first, starred) and archived ones (out of the way, kept for the timeline).
    out.archived = [...new Set((Array.isArray(raw.archived) ? raw.archived : []).map(String))].filter(id => !placed.has(id));
    out.pins = [...new Set((Array.isArray(raw.pins) ? raw.pins : []).map(String))];
    // A category exists only while someone is in it.
    const used = new Set(out.placements.map(p => p.sector).filter(Boolean));
    out.sectors = sectors.filter(s => used.has(s.id));
    const types = new Set(LINK_TYPES.map(t => t.id));
    const pairs = new Set();
    for (const l of Array.isArray(raw.links) ? raw.links : []) {
        if (!l?.a || !l?.b || l.a === l.b) continue;
        const key = [l.a, l.b].sort().join("|");
        if (pairs.has(key)) continue;
        pairs.add(key);
        out.links.push(normalizeLink(l, types));
    }
    return out;
}

function normalizeLink(l, types = new Set(LINK_TYPES.map(t => t.id))) {
    return {
        id: String(l.id ?? uid()),
        a: String(l.a),
        b: String(l.b),
        type: types.has(l.type) ? l.type : "ally",
        note: String(l.note ?? "").slice(0, 140),
        suspect: !!l.suspect
    };
}

/** The GM's official links: between two people, shown on every wheel that knows both. */
function normalizeOfficial(raw) {
    const out = [];
    const pairs = new Set();
    for (const l of Array.isArray(raw) ? raw : Object.values(raw ?? {})) {
        if (!l?.a || !l?.b || l.a === l.b) continue;
        const key = [l.a, l.b].sort().join("|");
        if (pairs.has(key)) continue;
        pairs.add(key);
        out.push({ ...normalizeLink(l), suspect: false, hidden: !!l.hidden, official: true });
    }
    return out;
}

/* -------------------------------------------- */
/*  Edits (pure: each returns a new wheel)      */
/* -------------------------------------------- */

const copy = bonds => JSON.parse(JSON.stringify(normalizeBonds(bonds)));

/** A new category holding one person (a category never exists empty). */
function createSector(bonds, entryId, { label, color } = {}, ring = 2) {
    const next = copy(bonds);
    const id = uid();
    next.sectors.push({ id, label: String(label ?? "").trim().slice(0, 60), color: color ?? SECTOR_COLORS[next.sectors.length % SECTOR_COLORS.length] });
    const was = next.placements.find(p => p.id === entryId);
    next.placements = next.placements.filter(p => p.id !== entryId);
    next.placements.push({ id: entryId, sector: id, ring: was?.ring ?? ring });
    return normalizeBonds(next);
}

function updateSector(bonds, id, changes) {
    const next = copy(bonds);
    const sector = next.sectors.find(s => s.id === id);
    if (sector) {
        if (changes.label !== undefined) sector.label = String(changes.label).trim().slice(0, 60);
        if (changes.color) sector.color = changes.color;
    }
    return normalizeBonds(next);
}

/** Dissolves a category: its people go back to their folders' slices, same distance. */
function removeSector(bonds, id) {
    const next = copy(bonds);
    for (const p of next.placements) if (p.sector === id) p.sector = null;
    return normalizeBonds(next);
}

/**
 * Puts a person at a ring, in a category (`sector` = its id) or in their folder's slice (null),
 * just before `beforeId`, or at the end. Moving inside the same cell reorders.
 */
function place(bonds, entryId, sector, ring, beforeId = null) {
    const next = copy(bonds);
    if (sector && !next.sectors.some(s => s.id === sector)) sector = null;
    ring = clampRing(ring);
    const rest = next.placements.filter(p => p.id !== entryId);
    next.archived = next.archived.filter(id => id !== entryId);
    const item = { id: entryId, sector: sector ?? null, ring };
    const anchor = beforeId ? rest.findIndex(p => p.id === beforeId) : -1;
    if (anchor >= 0) rest.splice(anchor, 0, item);
    else rest.push(item);
    next.placements = rest;
    return normalizeBonds(next);
}

function togglePin(bonds, entryId) {
    const next = copy(bonds);
    next.pins = next.pins.includes(entryId) ? next.pins.filter(id => id !== entryId) : [...next.pins, entryId];
    return normalizeBonds(next);
}

/** Archives someone: off the wheel and out of the "not placed" list, still in the timeline. */
function archive(bonds, entryId) {
    const next = copy(bonds);
    next.placements = next.placements.filter(p => p.id !== entryId);
    next.archived = [...new Set([...next.archived, entryId])];
    next.pins = next.pins.filter(id => id !== entryId);
    return normalizeBonds(next);
}

function restore(bonds, entryId) {
    const next = copy(bonds);
    next.archived = next.archived.filter(id => id !== entryId);
    return normalizeBonds(next);
}

function unplace(bonds, entryId) {
    const next = copy(bonds);
    next.placements = next.placements.filter(p => p.id !== entryId);
    return normalizeBonds(next);
}

/**
 * Creates the link between two nodes, or updates it if they are already linked.
 * `extra`: { note, suspect } (kept as they were when omitted).
 */
function setLink(bonds, a, b, type, extra = {}) {
    const next = copy(bonds);
    if (!a || !b || a === b) return next;
    const existing = next.links.find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
    if (existing) {
        existing.type = type;
        // A directed link keeps the direction the player just drew.
        existing.a = a;
        existing.b = b;
        if (extra.note !== undefined) existing.note = extra.note;
        if (extra.suspect !== undefined) existing.suspect = extra.suspect;
    } else {
        next.links.push({ id: uid(), a, b, type, note: extra.note ?? "", suspect: !!extra.suspect });
    }
    return normalizeBonds(next);
}

/** Same as setLink, for the GM's official list (an array). */
function setOfficial(list, a, b, type, extra = {}) {
    const next = normalizeOfficial(list).filter(l => !((l.a === a && l.b === b) || (l.a === b && l.b === a)));
    const was = normalizeOfficial(list).find(l => (l.a === a && l.b === b) || (l.a === b && l.b === a));
    next.push({ id: was?.id ?? uid(), a, b, type, note: extra.note ?? was?.note ?? "", hidden: extra.hidden ?? was?.hidden ?? false });
    return normalizeOfficial(next);
}

function removeOfficial(list, id) {
    return normalizeOfficial(list).filter(l => l.id !== id);
}

function removeLink(bonds, id) {
    const next = copy(bonds);
    next.links = next.links.filter(l => l.id !== id);
    return next;
}

/** Puts everyone not yet on the wheel in their folders' slices, on the given ring. */
function placeAll(bonds, entryIds, ring = 2) {
    const next = copy(bonds);
    const placed = new Set(next.placements.map(p => p.id));
    const archived = new Set(next.archived);
    for (const id of entryIds) if (!placed.has(id) && !archived.has(id)) next.placements.push({ id, sector: null, ring });
    return normalizeBonds(next);
}

/** The slice key a placement lands in: its category, else its folder (tag), else "_none". */
function sectorKeyOf(placement, tagOf) {
    return placement.sector ?? tagOf.get(placement.id) ?? NO_TAG;
}

const NO_TAG = "_none";

/* -------------------------------------------- */
/*  Geometry                                    */
/* -------------------------------------------- */

/** Angle 0 is the top of the wheel, growing clockwise. */
function polar(r, angle, g = GEOMETRY) {
    return { x: g.center + r * Math.sin(angle), y: g.center - r * Math.cos(angle) };
}

function toPolar(x, y, g = GEOMETRY) {
    const dx = x - g.center;
    const dy = y - g.center;
    let angle = Math.atan2(dx, -dy);
    if (angle < 0) angle += Math.PI * 2;
    return { r: Math.hypot(dx, dy), angle };
}

const ringMid = (ring, g) => (g.ringBands[ring - 1][0] + g.ringBands[ring - 1][1]) / 2;

/**
 * Lays the wheel out.
 * @param bonds    a normalized wheel
 * @param visible  Set of entry ids this viewer may see (others are skipped, never drawn)
 * @param partyIds node ids of the other party members, in order
 * @param tags     { list: [{ key, label, color }] in the GM's folder order, tagOf: Map(entryId → key),
 *                   noneLabel } — the slices people fall into by default
 * @returns { sectors, nodes: Map(id → {x, y, angle, ring, sector}), self, party }
 */
function layout(bonds, visible, partyIds = [], tags = {}, g = GEOMETRY) {
    const TAU = Math.PI * 2;
    const tagOf = tags.tagOf ?? new Map();
    const placements = bonds.placements.filter(p => visible.has(p.id)).map(p => ({ ...p, key: sectorKeyOf(p, tagOf) }));
    const present = new Set(placements.map(p => p.key));
    // Only slices with someone in them: folders in the GM's order, then the player's categories, then "no folder".
    const defs = [
        ...(tags.list ?? []).filter(t => present.has(t.key)).map(t => ({ id: t.key, label: t.label, color: t.color, custom: false })),
        ...bonds.sectors.filter(s => present.has(s.id)).map(s => ({ id: s.id, label: s.label, color: s.color, custom: true })),
        ...(present.has(NO_TAG) ? [{ id: NO_TAG, label: tags.noneLabel ?? "", color: "#857a65", custom: false }] : [])
    ];
    // A folder the viewer can't see as a tag still shows (its entries are known): fall back to "no folder".
    const known = new Set(defs.map(d => d.id));
    for (const p of placements) if (!known.has(p.key)) {
        p.key = NO_TAG;
        if (!known.has(NO_TAG)) { defs.push({ id: NO_TAG, label: tags.noneLabel ?? "", color: "#857a65", custom: false }); known.add(NO_TAG); }
    }

    const count = (key, ring) => placements.filter(p => p.key === key && p.ring === ring).length;
    const n = defs.length;
    const available = TAU - n * g.gap;
    const minSector = Math.min(g.minSector, (available / Math.max(1, n)) * 0.8);

    // Slice widths: room for the fullest ring, on a single lane; shrunk to fit when needed.
    const baseMid = k => (g.ringBands[k][0] + g.ringBands[k][1]) / 2;
    const needs = defs.map(d => Math.max(minSector, ...RINGS.map(ring => count(d.id, ring) * (g.nodeArc / baseMid(ring - 1)))));
    const total = needs.reduce((x, y) => x + y, 0);
    const widths = total <= available
        ? needs.map(w => w + (available - total) / Math.max(1, n))
        : needs.map(w => w * (available / total));

    const sectors = [];
    let cursor = n > 1 ? -widths[0] / 2 : -available / 2; // first slice centred at the top
    defs.forEach((d, i) => {
        const start = cursor + g.gap / 2;
        const end = start + widths[i];
        cursor = end + g.gap / 2;
        sectors.push({ ...d, index: i, start, end, mid: (start + end) / 2 });
    });

    // Rings grow with the campaign: when a slice can't hold a ring's people side by side, that
    // ring gets another lane and the wheel grows outward, instead of piling portraits up.
    const bands = [];
    const lanes = [];
    let edge = g.ringBands[0][0];
    for (let k = 0; k < 3; k++) {
        const base = g.ringBands[k][1] - g.ringBands[k][0];
        const laneR = edge + base / 2;
        let L = 1;
        for (const sector of sectors) {
            const perLane = Math.max(1, Math.floor(((sector.end - sector.start) * laneR) / g.nodeArc));
            L = Math.max(L, Math.ceil(count(sector.id, k + 1) / perLane));
        }
        const width = base + (L - 1) * g.laneWidth;
        bands.push([edge, edge + width]);
        lanes.push(L);
        edge += width;
    }
    const outer = bands[2][1];
    const geo = { ...g, ringBands: bands, labelRadius: outer + 22, outer, lanes };

    const nodes = new Map();
    for (const sector of sectors) {
        const span = sector.end - sector.start;
        for (const ring of RINGS) {
            const k = ring - 1;
            const cell = placements.filter(p => p.key === sector.id && p.ring === ring);
            if (!cell.length) continue;
            const [r0, r1] = bands[k];
            const laneDepth = (r1 - r0) / lanes[k];
            // Fill from the inside out, one lane at a time.
            let i = 0;
            for (let lane = 0; lane < lanes[k] && i < cell.length; lane++) {
                const r = r0 + (lane + 0.5) * laneDepth;
                const perLane = Math.max(1, Math.floor((span * r) / g.nodeArc));
                const row = cell.slice(i, i + perLane);
                i += row.length;
                const step = g.nodeArc / r;
                const used = Math.min(span * 0.94, row.length * step);
                // Odd lanes sit half a seat over, like an amphitheatre.
                const shift = lane % 2 && row.length * step < span * 0.94 - step / 2 ? step / 2 : 0;
                const first = sector.mid - used / 2 + shift;
                row.forEach((p, j) => {
                    const angle = first + (j + 0.5) * (used / row.length);
                    nodes.set(p.id, { ...polar(r, angle, g), angle, ring, sector: sector.id, r });
                });
            }
        }
    }

    const party = partyIds.map((id, i) => {
        const angle = partyIds.length === 1 ? Math.PI : (i / partyIds.length) * TAU + Math.PI / partyIds.length;
        const point = { ...polar(g.partyRadius, angle, g), angle, r: g.partyRadius, id };
        nodes.set(id, point);
        return point;
    });
    const self = { x: g.center, y: g.center, angle: 0, r: 0, id: SELF };
    nodes.set(SELF, self);

    return { sectors, nodes, party, self, g: geo };
}

const norm = a => ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);

/** True when `angle` lies inside a slice (both may wrap past the top). */
function inSector(angle, sector) {
    const span = sector.end - sector.start;
    return norm(angle - sector.start) <= span;
}

/**
 * Where a drop lands: { kind: "cell", sector, ring, before } inside the wheel — `sector` is the
 * slice key under the pointer (null on an empty wheel), `before` the person the dropped one goes
 * in front of (null = the end) —, { kind: "out" } past the outer edge (take off the wheel),
 * or { kind: "none" } over the centre and party.
 */
function hitTest(x, y, laid, draggedId = null) {
    const g = laid.g ?? GEOMETRY;
    const { r, angle } = toPolar(x, y, g);
    const outer = g.ringBands[2][1];
    if (r > outer + 24) return { kind: "out" };
    if (r < g.ringBands[0][0]) return { kind: "none" };
    const ring = r < g.ringBands[0][1] ? 1 : r < g.ringBands[1][1] ? 2 : 3;
    if (!laid.sectors.length) return { kind: "cell", sector: null, ring, before: null };
    let sector = laid.sectors.find(s => inSector(angle, s));
    if (!sector) {
        const dist = s => Math.min(Math.abs(norm(angle - s.start)), Math.abs(norm(s.start - angle)),
            Math.abs(norm(angle - s.end)), Math.abs(norm(s.end - angle)));
        sector = [...laid.sectors].sort((a, b) => dist(a) - dist(b))[0];
    }
    const rel = a => norm(a - sector.start);
    const target = rel(angle);
    let before = null;
    let best = Infinity;
    for (const [id, node] of laid.nodes) {
        if (id === draggedId || node.sector !== sector.id || node.ring !== ring) continue;
        const d = rel(node.angle);
        if (d > target && d < best) { best = d; before = id; }
    }
    return { kind: "cell", sector: sector.id, ring, before };
}

/* -------------------------------------------- */
/*  SVG path helpers                            */
/* -------------------------------------------- */

const f = n => Math.round(n * 10) / 10;

/** Annular wedge between two radii and two angles. */
function wedgePath(r1, r2, a1, a2, g = GEOMETRY) {
    const large = a2 - a1 > Math.PI ? 1 : 0;
    const p1 = polar(r2, a1, g), p2 = polar(r2, a2, g), p3 = polar(r1, a2, g), p4 = polar(r1, a1, g);
    return `M${f(p1.x)} ${f(p1.y)}A${r2} ${r2} 0 ${large} 1 ${f(p2.x)} ${f(p2.y)}L${f(p3.x)} ${f(p3.y)}A${r1} ${r1} 0 ${large} 0 ${f(p4.x)} ${f(p4.y)}Z`;
}

/** Open arc; reversed so text along it reads left-to-right on the lower half of the wheel. */
function arcPath(r, a1, a2, g = GEOMETRY) {
    const mid = norm((a1 + a2) / 2);
    const bottom = mid > Math.PI / 2 && mid < Math.PI * 1.5;
    const large = a2 - a1 > Math.PI ? 1 : 0;
    const s = polar(r, bottom ? a2 : a1, g), e = polar(r, bottom ? a1 : a2, g);
    return { d: `M${f(s.x)} ${f(s.y)}A${r} ${r} 0 ${large} ${bottom ? 0 : 1} ${f(e.x)} ${f(e.y)}`, bottom };
}

/**
 * A gentle curve between two portraits, bowed away from the centre so links don't cross the
 * self portrait, trimmed by each portrait's radius so arrowheads land on the rim.
 */
function linkPath(p, q, rp = 0, rq = 0, g = GEOMETRY, bend = 0.5) {
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const dx = q.x - p.x, dy = q.y - p.y;
    const len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;
    if ((mx - g.center) * nx + (my - g.center) * ny < 0) { nx = -nx; ny = -ny; }
    // bend 0 = a straight line, 0.5 = the default gentle curve, 1 = a strong arc.
    const bow = Math.min(120, len * 0.36) * Math.max(0, Math.min(1, bend));
    const cx = mx + nx * bow, cy = my + ny * bow;
    const toward = (from, r) => {
        const vx = cx - from.x, vy = cy - from.y;
        const d = Math.hypot(vx, vy) || 1;
        return { x: from.x + (vx / d) * r, y: from.y + (vy / d) * r };
    };
    const s = toward(p, rp), e = toward(q, rq);
    // Midpoint of the quadratic curve, for the relation icon.
    const ix = 0.25 * s.x + 0.5 * cx + 0.25 * e.x, iy = 0.25 * s.y + 0.5 * cy + 0.25 * e.y;
    return { d: `M${f(s.x)} ${f(s.y)}Q${f(cx)} ${f(cy)} ${f(e.x)} ${f(e.y)}`, mid: { x: ix, y: iy } };
}

/** How a viewer likes links drawn (their own preference, kept per user). */
const LINK_STYLE_DEFAULT = { shape: "curve", bend: 0.5, show: "always" };

function normalizeLinkStyle(raw) {
    const r = raw && typeof raw === "object" ? raw : {};
    return {
        shape: ["curve", "angular"].includes(r.shape) ? r.shape : LINK_STYLE_DEFAULT.shape,
        bend: Number.isFinite(Number(r.bend)) ? Math.max(0, Math.min(1, Number(r.bend))) : LINK_STYLE_DEFAULT.bend,
        show: ["always", "focus"].includes(r.show) ? r.show : LINK_STYLE_DEFAULT.show
    };
}

/**
 * Angular links, like a circuit or FFXVI's chart: out along the radius, around the wheel on a
 * ring just inside the nearer person, then out again. Links from the centre are a straight spoke.
 * Links therefore follow the wheel's own geometry instead of crossing it.
 */
function angularPath(p, q, rp = 0, rq = 0, g = GEOMETRY) {
    const P = toPolar(p.x, p.y, g), Q = toPolar(q.x, q.y, g);
    // From the centre (or to it): one straight spoke.
    if (P.r < 1 || Q.r < 1) {
        const [c, o, ro, rc] = P.r < 1 ? [P, Q, rq, rp] : [Q, P, rp, rq];
        const s = polar(rc, o.angle, g), e = polar(o.r - ro, o.angle, g);
        const [a, b] = P.r < 1 ? [s, e] : [e, s];
        return { d: `M${f(a.x)} ${f(a.y)}L${f(b.x)} ${f(b.y)}`, mid: { x: (s.x + e.x) / 2, y: (s.y + e.y) / 2 } };
    }
    // The ring to travel around: just inside whoever is nearer the centre, never inside the party band.
    const inner = Math.min(P.r, Q.r);
    const rm = inner > g.partyBand[1] + 20 ? Math.max(g.partyBand[1] + 6, inner - 36) : inner;
    let delta = Q.angle - P.angle;
    while (delta > Math.PI) delta -= Math.PI * 2;
    while (delta < -Math.PI) delta += Math.PI * 2;
    const leave = (pt, r) => (pt.r > rm ? pt.r - r : pt.r + (pt.r === rm ? 0 : r));
    const s = polar(P.r === rm ? P.r : leave(P, rp), P.angle, g);
    const e = polar(Q.r === rm ? Q.r : leave(Q, rq), Q.angle, g);
    const a1 = polar(rm, P.angle, g), a2 = polar(rm, Q.angle, g);
    // On the travel ring itself (e.g. two party members), trim along the arc instead.
    const startArc = P.r === rm ? polar(rm, P.angle + Math.sign(delta) * (rp / rm), g) : a1;
    const endArc = Q.r === rm ? polar(rm, Q.angle - Math.sign(delta) * (rq / rm), g) : a2;
    const sweep = delta > 0 ? 1 : 0;
    const large = Math.abs(delta) > Math.PI ? 1 : 0;
    const d = [
        P.r === rm ? `M${f(startArc.x)} ${f(startArc.y)}` : `M${f(s.x)} ${f(s.y)}L${f(a1.x)} ${f(a1.y)}`,
        Math.abs(delta) > 0.001 ? `A${f(rm)} ${f(rm)} 0 ${large} ${sweep} ${f(endArc.x)} ${f(endArc.y)}` : "",
        Q.r === rm ? "" : `L${f(e.x)} ${f(e.y)}`
    ].join("");
    const mid = Math.abs(delta) > 0.05 ? polar(rm, P.angle + delta / 2, g) : { x: (s.x + e.x) / 2, y: (s.y + e.y) / 2 };
    return { d, mid };
}

/* -------------------------------------------- */
/*  Timeline                                    */
/* -------------------------------------------- */

/**
 * What changed for one wheel between two moments (or a moment and now).
 * @returns {{ added: string[], removed: string[], closer: string[], farther: string[], died: string[], missing: string[], moves: Map }}
 */
function diffWheels(before, after, statusBefore = {}, statusAfter = {}) {
    const a = new Map(normalizeBonds(before).placements.map(p => [p.id, p.ring]));
    const b = new Map(normalizeBonds(after).placements.map(p => [p.id, p.ring]));
    const out = { added: [], removed: [], closer: [], farther: [], died: [], missing: [], moves: new Map() };
    for (const [id, ring] of b) {
        if (!a.has(id)) out.added.push(id);
        else if (ring < a.get(id)) { out.closer.push(id); out.moves.set(id, [a.get(id), ring]); }
        else if (ring > a.get(id)) { out.farther.push(id); out.moves.set(id, [a.get(id), ring]); }
    }
    for (const id of a.keys()) if (!b.has(id)) out.removed.push(id);
    for (const [id, status] of Object.entries(statusAfter)) {
        const was = statusBefore[id] ?? "alive";
        if (status === "dead" && was !== "dead") out.died.push(id);
        else if (status === "missing" && was !== "missing") out.missing.push(id);
    }
    return out;
}

/**
 * The Bonds wheel: framework-free DOM view. It knows nothing about Foundry — everything it
 * needs comes through an adapter, so the module and the standalone preview run the same code.
 *
 * adapter = {
 *   t(key), getModel(), saveBonds(bonds), openCard(entryId),
 *   selectPlayer(userId), selectMoment(momentId | null), recordMoment(), deleteMoment(momentId)
 * }
 * getModel() → {
 *   editable, isGM, owner: { id, name }, self: { name, img }, party: [{ id, name, img }],
 *   entries: [{ id, name, title, img, frame, status, isNew, tag }], bonds,
 *   tags: [{ key, label, color }] (Persona folders, in the GM's order — the default slices),
 *   players: [{ id, name }], moments: [{ id, label, ts }], momentId,
 *   official: [{ id, a, b, type, note, hidden }] (GM links this viewer may see),
 *   changes: { newIds, statusIds, linkIds } | null (since the player last looked),
 *   inScene: [entryId] | null (people with a token on the current scene)
 * }
 */

const G = GEOMETRY;
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NODE_R = { self: 58, party: 38, entry: 31 };
const DRAG_THRESHOLD = 5;

class BondsView {
    /** Pan and zoom of the stage; `auto` refits when the window is resized. */
    #cam = { s: 1, x: 0, y: 0, auto: true };
    #model = null;
    #bonds = null;
    #laid = null;
    #visible = new Set();
    #tagOf = new Map();
    #linkMode = false;
    /** The portrait shown in the inspector and in focus on the wheel. */
    #selected = null;
    #query = "";
    #hideDead = false;
    #sceneOnly = false;
    #overview = false;
    #overviewQuery = "";
    /** What this view saw last time, to animate what changes live (a reveal, a death). */
    #lastSeen = null;
    #moments = { arriving: new Set(), dying: new Set(), vanishing: new Set() };
    #linkFrom = null;
    #gesture = null;
    #resize = null;

    constructor(host, adapter) {
        this.host = host;
        this.adapter = adapter;
        this.t = key => adapter.t(`PERSONA.Bonds.${key}`);
        host.classList.add("persona", "bonds-host");
        host.addEventListener("pointerdown", this.#onPointerDown);
        host.addEventListener("pointermove", this.#onHover);
        host.addEventListener("click", this.#onClick);
        host.addEventListener("dblclick", this.#onDoubleClick);
        host.addEventListener("pointerover", this.#onOver);
        host.addEventListener("pointerout", this.#onOut);
        host.addEventListener("input", this.#onInput);
        host.addEventListener("wheel", this.#onWheel, { passive: false });
        host.addEventListener("keydown", this.#onKey);
        host.addEventListener("submit", this.#onSubmit);
        this.#resize = new ResizeObserver(() => { if (this.#cam.auto) this.fit(); });
        this.refresh();
    }

    destroy() {
        this.#resize?.disconnect();
        this.host.removeEventListener("pointerdown", this.#onPointerDown);
        this.host.removeEventListener("pointermove", this.#onHover);
        this.host.removeEventListener("click", this.#onClick);
        this.host.removeEventListener("dblclick", this.#onDoubleClick);
        this.host.removeEventListener("pointerover", this.#onOver);
        this.host.removeEventListener("pointerout", this.#onOut);
        this.host.removeEventListener("input", this.#onInput);
        this.host.removeEventListener("wheel", this.#onWheel);
        this.host.removeEventListener("keydown", this.#onKey);
        this.host.removeEventListener("submit", this.#onSubmit);
        this.#endGesture();
    }

    /* -------------------------------------------- */
    /*  Rendering                                   */
    /* -------------------------------------------- */

    /** Re-reads the model and redraws (keeps the camera). Skipped mid-drag, redrawn after. */
    refresh() {
        if (this.#gesture?.dragging) { this.#gesture.stale = true; return; }
        const previous = this.#model?.owner?.id;
        this.#model = this.adapter.getModel();
        this.#bonds = normalizeBonds(this.#model.bonds);
        // Another player's wheel (GM): a half-drawn link belongs to the old one.
        if (previous !== undefined && previous !== this.#model.owner?.id) this.#linkFrom = null;
        if (previous !== undefined && previous !== this.#model.owner?.id) this.#selected = null;
        if (!this.#model.editable) this.#linkMode = false;
        this.#diffLive();
        this.#render();
    }

    /**
     * Live moments while the window is open: someone just revealed to this player arrives with a
     * glow; someone who just died fades to grey on every open wheel. Only between two refreshes of
     * the same wheel in the present — never on first open, a player switch or a past moment.
     */
    #diffLive() {
        const m = this.#model;
        const now = { owner: m.owner?.id, past: !!m.momentId, status: new Map(m.entries.map(e => [e.id, e.status])) };
        const before = this.#lastSeen;
        this.#lastSeen = now;
        this.#moments = { arriving: new Set(), dying: new Set(), vanishing: new Set() };
        if (!before || before.owner !== now.owner || before.past || now.past) return;
        for (const [id, status] of now.status) {
            if (!before.status.has(id)) this.#moments.arriving.add(id);
            else if (before.status.get(id) !== status && status === "dead") this.#moments.dying.add(id);
            else if (before.status.get(id) !== status && status === "missing") this.#moments.vanishing.add(id);
        }
        const any = this.#moments.arriving.size || this.#moments.dying.size || this.#moments.vanishing.size;
        if (any) clearTimeout(this.#momentTimer), this.#momentTimer = setTimeout(() => {
            this.#moments = { arriving: new Set(), dying: new Set(), vanishing: new Set() };
            this.host.querySelectorAll(".is-arriving, .is-dying, .is-vanishing").forEach(el => el.classList.remove("is-arriving", "is-dying", "is-vanishing"));
        }, 4000);
    }

    #momentTimer = null;

    #liveClass(id) {
        return this.#moments.arriving.has(id) ? "is-arriving" : this.#moments.dying.has(id) ? "is-dying" : this.#moments.vanishing.has(id) ? "is-vanishing" : "";
    }

    #entryMap() {
        return new Map(this.#model.entries.map(e => [e.id, e]));
    }

    #render() {
        const m = this.#model;
        const entries = this.#entryMap();
        // "Hide the dead" only thins the wheel; they stay in the inspector and the timeline.
        const scene = new Set(m.inScene ?? []);
        if (this.#sceneOnly && !scene.size) this.#sceneOnly = false;
        this.#visible = new Set([...entries.keys()].filter(id => {
            if (id === this.#selected) return true;
            if (this.#hideDead && entries.get(id).status === "dead") return false;
            if (this.#sceneOnly && !scene.has(id)) return false;
            return true;
        }));
        this.#tagOf = new Map(m.entries.map(e => [e.id, e.tag ?? NO_TAG]));
        this.#laid = layout(this.#bonds, this.#visible, m.party.map(p => p.id), { list: m.tags ?? [], tagOf: this.#tagOf, noneLabel: this.t("NoFolder") });
        const placed = new Set(this.#bonds.placements.map(p => p.id));
        const archivedIds = new Set(this.#bonds.archived);
        const loose = m.entries.filter(e => !placed.has(e.id) && !archivedIds.has(e.id));
        if (this.#overview && !m.overview) this.#overview = false;
        if (this.#selected && !this.#nodeInfo(this.#selected)) this.#selected = null;
        const pop = this.host.querySelector(".bonds-pop");
        const keepPop = pop && !pop.hidden ? pop.outerHTML : null;

        this.host.innerHTML = `
        <div class="bonds ${m.editable ? "is-editable" : "is-readonly"} ${this.#linkMode ? "is-linking" : ""} ${m.momentId ? "is-past" : ""} ${this.#bonds.links.length > 14 ? "is-dense" : ""} ${this.#linkStyle().show === "focus" ? "is-lines-focus" : ""}" tabindex="-1">
            ${this.#renderBar()}
            ${this.#overview ? this.#renderOverview() : `<div class="bonds-main">
                <div class="bonds-viewport" data-viewport>
                    <div class="bonds-stage" data-stage>
                        ${this.#renderSvg()}
                        <div class="bonds-layer">${this.#renderNodes(entries)}${this.#renderLinkMarkers()}</div>
                    </div>
                    ${this.#renderBanner() || this.#renderChanges(entries)}
                    ${this.#renderFinder(entries)}
                    ${this.#renderLegend()}
                    <div class="bonds-zoom">
                        <button type="button" class="persona-icon-btn" data-action="zoomIn" aria-label="${esc(this.t("ZoomIn"))}" title="${esc(this.t("ZoomIn"))}"><i class="fa-solid fa-plus" inert></i></button>
                        <button type="button" class="persona-icon-btn" data-action="zoomOut" aria-label="${esc(this.t("ZoomOut"))}" title="${esc(this.t("ZoomOut"))}"><i class="fa-solid fa-minus" inert></i></button>
                        <button type="button" class="persona-icon-btn" data-action="fit" aria-label="${esc(this.t("Fit"))}" title="${esc(this.t("Fit"))}"><i class="fa-solid fa-expand" inert></i></button>
                        <button type="button" class="persona-icon-btn" data-action="linkStyle" aria-label="${esc(this.t("LinkStyle"))}" title="${esc(this.t("LinkStyle"))}"><i class="fa-solid fa-bezier-curve" inert></i></button>
                    </div>
                </div>
                ${this.#selected ? this.#renderInspector(loose) : this.#renderDrawer(loose)}
            </div>`}
            ${this.#overview ? "" : this.#renderTimeline()}
            <div class="bonds-pop" hidden></div>
        </div>`;

        this.#applyCam();
        const viewport = this.host.querySelector("[data-viewport]");
        this.#resize.disconnect();
        if (!viewport) return this.#filterOverview();
        this.#resize.observe(viewport);
        if (this.#cam.auto) this.fit();
        if (keepPop) this.#closePop();
        this.#applyFocus(this.#selected);
        this.#filterLoose();
    }

    #renderBar() {
        const m = this.#model;
        const moment = m.momentId ? m.moments.find(x => x.id === m.momentId) : null;
        const players = m.isGM && m.players.length
            ? `<nav class="bonds-players" aria-label="${esc(this.t("Players"))}">${m.players.map(p => `
                <button type="button" class="bonds-player ${p.id === m.owner.id ? "is-active" : ""}" data-action="player" data-id="${esc(p.id)}" aria-pressed="${p.id === m.owner.id}" title="${esc(p.name)}${p.user ? ` (${esc(p.user)})` : ""}">
                    <span class="bonds-player__img"><img src="${esc(p.img)}" alt="" draggable="false"></span>
                    <span class="bonds-player__name">${esc(p.name)}</span>
                </button>`).join("")}</nav>`
            : "";
        const sub = moment ? this.adapter.t("PERSONA.Bonds.SubPast").replace("{label}", moment.label)
            : m.isGM && m.editable ? this.adapter.t("PERSONA.Bonds.SubGM").replace("{name}", m.owner.name)
            : m.editable ? this.t("SubPlayer") : "";
        const tools = [
            !this.#overview && m.owner?.id ? `<button type="button" class="persona-icon-btn" data-action="exportImage" title="${esc(this.t("Export"))}" aria-label="${esc(this.t("Export"))}"><i class="fa-solid fa-image" inert></i></button>` : "",
            m.overview ? `<button type="button" class="persona-button bonds-tool ${this.#overview ? "is-on" : ""}" data-action="toggleOverview" aria-pressed="${this.#overview}"><i class="fa-solid fa-table-cells" inert></i><span>${esc(this.t("Overview"))}</span></button>` : "",
            m.isGM && m.players.length ? `<button type="button" class="persona-button bonds-tool bonds-tool--accent" data-action="recordMoment" title="${esc(this.t("RecordHint"))}"><i class="fa-solid fa-camera-retro" inert></i><span>${esc(this.t("Record"))}</span></button>` : ""
        ].join("");
        return `
        <header class="bonds-bar">
            <div class="bonds-who">
                <span class="bonds-who__img"><img src="${esc(m.self.img)}" alt="" draggable="false"></span>
                <div class="bonds-who__text">
                    <h2>${esc(m.owner?.name ? this.adapter.t("PERSONA.Bonds.TitleOf").replace("{name}", m.owner.name) : this.t("Title"))}</h2>
                    ${sub ? `<p>${esc(sub)}</p>` : ""}
                </div>
            </div>
            ${players}
            <div class="bonds-bar__tools">${tools}</div>
        </header>`;
    }

    #renderSvg() {
        const m = this.#model;
        const laid = this.#laid;
        const C = G.center;
        const g = laid.g;
        const outer = g.ringBands[2][1];
        const inner = g.ringBands[0][0];
        const parts = [];

        // Gradients per slice colour, brightest near the party, fading outward.
        const defs = [`<radialGradient id="bonds-bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#3a2a22"/><stop offset="0.55" stop-color="#211d19"/><stop offset="1" stop-color="#14120f" stop-opacity="0"/></radialGradient>`];
        const colors = [...new Set(laid.sectors.map(s => s.color))];
        colors.forEach((color, i) => defs.push(`<radialGradient id="bonds-g${i}" gradientUnits="userSpaceOnUse" cx="${C}" cy="${C}" r="${outer}"><stop offset="${(inner / outer).toFixed(3)}" stop-color="${color}" stop-opacity="0.42"/><stop offset="0.7" stop-color="${color}" stop-opacity="0.16"/><stop offset="1" stop-color="${color}" stop-opacity="0.05"/></radialGradient>`));
        defs.push(`<pattern id="bonds-etch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 7h14M7 0v14" stroke="rgba(214,138,92,0.14)" stroke-width="1"/></pattern>`);
        for (const type of LINK_TYPES.filter(t => t.directed)) {
            defs.push(`<marker id="bonds-arrow-${type.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${type.color}"/></marker>`);
        }
        const gradient = color => `url(#bonds-g${colors.indexOf(color)})`;

        parts.push(`<circle cx="${C}" cy="${C}" r="${g.labelRadius + 16}" fill="url(#bonds-bg)"/>`);
        // Fine radial grid, like an astrolabe.
        const spokes = [];
        for (let a = 0; a < 360; a += 6) {
            const p = polar(inner, a * Math.PI / 180), q = polar(outer, a * Math.PI / 180);
            spokes.push(`M${p.x.toFixed(1)} ${p.y.toFixed(1)}L${q.x.toFixed(1)} ${q.y.toFixed(1)}`);
        }
        parts.push(`<path class="bonds-grid" d="${spokes.join("")}"/>`);
        for (const r of [inner, g.ringBands[0][1], g.ringBands[1][1], outer]) parts.push(`<circle class="bonds-ring" cx="${C}" cy="${C}" r="${r}"/>`);

        // Slices: a wedge per ring (drop targets), divider arcs, the label along the rim.
        for (const s of laid.sectors) {
            parts.push(`<path class="bonds-sector" d="${wedgePath(inner, outer, s.start, s.end)}" fill="${gradient(s.color)}" stroke="${s.color}"/>`);
            for (const ring of RINGS) {
                const [r1, r2] = g.ringBands[ring - 1];
                parts.push(`<path class="bonds-cell" data-cell="${esc(s.id)}|${ring}" d="${wedgePath(r1, r2, s.start, s.end)}"/>`);
            }
            for (const r of [g.ringBands[0][1], g.ringBands[1][1]]) {
                parts.push(`<path class="bonds-divider" d="${arcPath(r, s.start, s.end).d}" stroke="${s.color}"/>`);
            }
            const arc = arcPath(g.labelRadius, s.start, s.end);
            // Narrow slices (a campaign with many folders) shorten their label to fit the arc.
            const fits = Math.max(3, Math.floor(((s.end - s.start) * g.labelRadius) / 15));
            const full = s.label || this.t("Unnamed");
            const label = full.length > fits ? `${full.slice(0, Math.max(2, fits - 1)).trimEnd()}…` : full;
            parts.push(`<path id="bonds-arc-${esc(s.id)}" d="${arc.d}" fill="none"/>`);
            parts.push(`<text class="bonds-sector-label" ${m.editable && s.custom ? `data-action="editSector" data-id="${esc(s.id)}"` : ""} fill="${s.color}" dy="${arc.bottom ? 12 : 0}"><textPath href="#bonds-arc-${esc(s.id)}" startOffset="50%" text-anchor="middle">${esc(label)}</textPath></text>`);
        }
        if (!laid.sectors.length) {
            parts.push(`<circle class="bonds-empty-ring" cx="${C}" cy="${C}" r="${(inner + outer) / 2}"/>`);
            parts.push(`<text class="bonds-empty-text" x="${C}" y="${C - (inner + outer) / 2 - 12}" text-anchor="middle">${esc(m.editable ? this.t("EmptyWheel") : this.t("EmptyWheelReadOnly"))}</text>`);
        }

        // The party ring and the centre.
        parts.push(`<circle class="bonds-party-band" cx="${C}" cy="${C}" r="${(G.partyBand[0] + G.partyBand[1]) / 2}" stroke-width="${G.partyBand[1] - G.partyBand[0]}"/>`);
        parts.push(`<circle class="bonds-ring bonds-ring--party" cx="${C}" cy="${C}" r="${G.partyBand[1]}"/>`);
        parts.push(`<circle class="bonds-ring bonds-ring--self" cx="${C}" cy="${C}" r="${G.partyBand[0]}"/>`);
        // The party needs no caption: an engraved band, and a gold thread the companions sit on.
        parts.push(`<circle class="bonds-party-etch" cx="${C}" cy="${C}" r="${(G.partyBand[0] + G.partyBand[1]) / 2}" stroke-width="${G.partyBand[1] - G.partyBand[0] - 6}" fill="none" stroke="url(#bonds-etch)"/>`);
        if (m.party.length) parts.push(`<circle class="bonds-party-thread" cx="${C}" cy="${C}" r="${G.partyRadius}"/>`);

        // Links between portraits.
        const links = [];
        for (const link of this.#allLinks()) {
            const geo = this.#linkGeometry(link);
            if (!geo) continue;
            const type = LINK_TYPES.find(t => t.id === link.type) ?? LINK_TYPES[0];
            const cls = `${link.suspect ? "is-suspect" : ""} ${link.official ? "is-official" : ""} ${link.hidden ? "is-hidden" : ""}`;
            // Official links: a dark casing under the line, like an inked seal.
            if (link.official) links.push(`<path class="bonds-link-casing ${cls}" data-a="${esc(link.a)}" data-b="${esc(link.b)}" d="${geo.d}"/>`);
            links.push(`<path class="bonds-link bonds-link--${type.id} ${cls}" data-a="${esc(link.a)}" data-b="${esc(link.b)}" d="${geo.d}" stroke="${type.color}" ${type.directed ? `marker-end="url(#bonds-arrow-${type.id})"` : ""}/>`);
        }
        parts.push(`<g class="bonds-links">${links.join("")}<path class="bonds-rubber" data-rubber d="" /></g>`);

        return `<svg class="bonds-svg" viewBox="0 0 ${G.size} ${G.size}" width="${G.size}" height="${G.size}" aria-hidden="true"><defs>${defs.join("")}</defs>${parts.join("")}</svg>`;
    }

    #radiusOf(id) {
        if (id === SELF) return NODE_R.self;
        return this.#model.party.some(p => p.id === id) ? NODE_R.party : NODE_R.entry;
    }

    #linkGeometry(link) {
        const a = this.#laid.nodes.get(link.a), b = this.#laid.nodes.get(link.b);
        if (!a || !b) return null;
        const style = this.#linkStyle();
        const g = this.#laid.g ?? G;
        return style.shape === "angular"
            ? angularPath(a, b, this.#radiusOf(link.a) + 3, this.#radiusOf(link.b) + 5, g)
            : linkPath(a, b, this.#radiusOf(link.a) + 3, this.#radiusOf(link.b) + 5, g, style.bend);
    }

    #renderNodes(entries) {
        const m = this.#model;
        const laid = this.#laid;
        const sectors = new Map(laid.sectors.map(s => [s.id, s]));
        const out = [];
        const changed = new Set([...(m.changes?.newIds ?? []), ...(m.changes?.statusIds ?? [])]);
        // Looking back at a moment: who arrived or moved in it.
        const diff = m.momentId ? m.moments.find(x => x.id === m.momentId)?.diff : null;
        const moved = new Set(diff ? [...diff.added, ...diff.closer, ...diff.farther, ...diff.died, ...diff.missing] : []);
        const pins = new Set(this.#bonds.pins);
        const picked = id => [this.#linkFrom === id ? "is-picked" : "", this.#selected === id ? "is-selected" : "", changed.has(id) ? "is-changed" : "", moved.has(id) ? "is-moved" : "", pins.has(id) ? "is-pinned" : ""].join(" ");

        out.push(`<button type="button" class="bonds-node bonds-node--self ${picked(SELF)}" data-node="${SELF}" style="left:${G.center}px;top:${G.center}px">
            <span class="bonds-node__img"><img src="${esc(m.self.img)}" alt="" draggable="false"></span><span class="bonds-node__name">${esc(m.self.name)}</span></button>`);
        for (const p of m.party) {
            const pos = laid.nodes.get(p.id);
            out.push(`<button type="button" class="bonds-node bonds-node--party ${pos.y < G.center - 1 ? "is-upper" : ""} ${picked(p.id)}" data-node="${esc(p.id)}" style="left:${pos.x}px;top:${pos.y}px">
                <span class="bonds-node__img"><img src="${esc(p.img)}" alt="" draggable="false"></span><span class="bonds-node__name">${esc(p.name)}</span></button>`);
        }
        for (const placement of this.#bonds.placements) {
            const entry = entries.get(placement.id);
            const pos = laid.nodes.get(placement.id);
            if (!entry || !pos) continue;
            const color = sectors.get(placement.sector)?.color ?? SECTOR_COLORS[0];
            out.push(this.#entryNode(entry, `left:${pos.x}px;top:${pos.y}px;--c:${color}`, `${picked(entry.id)} ${this.#liveClass(entry.id)}`));
        }
        return out.join("");
    }

    #entryNode(entry, style, extra = "") {
        const status = entry.status && entry.status !== "alive" ? `is-${entry.status}` : "";
        const mark = entry.status === "dead" ? `<span class="bonds-node__mark"><i class="fa-solid fa-skull" inert></i></span>`
            : entry.status === "missing" ? `<span class="bonds-node__mark"><i class="fa-solid fa-question" inert></i></span>` : "";
        const name = entry.name ?? "???";
        const statusText = entry.status && entry.status !== "alive" ? this.adapter.t(`PERSONA.Status.${entry.status}`) : "";
        return `<button type="button" class="bonds-node bonds-node--entry ${status} ${entry.isNew ? "is-new" : ""} ${extra}" data-node="${esc(entry.id)}" data-entry="${esc(entry.id)}" style="${style}" aria-label="${esc(name)}">
            <span class="bonds-node__img"><img class="persona-fit" src="${esc(entry.img)}" style="${esc(entry.frame ?? "")}" alt="" draggable="false"></span>${mark}<span class="bonds-node__pin"><i class="fa-solid fa-star" inert></i></span>
            <span class="bonds-node__name">${esc(name)}${entry.title ? `<small>${esc(entry.title)}</small>` : ""}${statusText ? `<small class="bonds-node__status">${esc(statusText)}</small>` : ""}</span></button>`;
    }

    #renderLinkMarkers() {
        return this.#allLinks().map(link => {
            const geo = this.#linkGeometry(link);
            if (!geo) return "";
            const type = LINK_TYPES.find(t => t.id === link.type) ?? LINK_TYPES[0];
            const label = [this.t(`Type.${type.id}`), link.suspect ? this.t("Suspected") : "", link.official ? this.t("Official") : "", link.note].filter(Boolean).join(" — ");
            const badge = link.suspect ? `<span class="bonds-marker__badge">?</span>` : link.official ? `<span class="bonds-marker__badge is-seal"><i class="fa-solid fa-stamp" inert></i></span>` : "";
            return `<button type="button" class="bonds-marker ${link.suspect ? "is-suspect" : ""} ${link.official ? "is-official" : ""} ${link.hidden ? "is-hidden" : ""}" ${this.#canEditLink(link) ? `data-action="editLink"` : ""} data-id="${esc(link.id)}" data-a="${esc(link.a)}" data-b="${esc(link.b)}" style="left:${geo.mid.x}px;top:${geo.mid.y}px;--c:${type.color}" title="${esc(label)}" aria-label="${esc(label)}"><i class="${type.icon}" inert></i>${badge}</button>`;
        }).join("");
    }

    /** The player's links plus the GM's official ones this viewer may see. */
    #allLinks() {
        return [...this.#bonds.links, ...(this.#model.official ?? []).map(l => ({ ...l, official: true, suspect: false }))];
    }

    #canEditLink(link) {
        const m = this.#model;
        if (m.momentId) return false;
        return link.official ? m.isGM : m.editable;
    }

    /** "Since you last looked": new people, deaths and disappearances, new official links. */
    #renderChanges(entries) {
        const c = this.#model.changes;
        if (!c) return "";
        const people = [...new Set([...c.newIds, ...c.statusIds])].map(id => entries.get(id)).filter(Boolean);
        const parts = [];
        if (c.newIds.length) parts.push(this.adapter.t(c.newIds.length === 1 ? "PERSONA.Bonds.ChangeNew1" : "PERSONA.Bonds.ChangeNew").replace("{n}", c.newIds.length));
        const deaths = c.statusIds.filter(id => entries.get(id)?.status === "dead").length;
        const other = c.statusIds.length - deaths;
        if (deaths) parts.push(this.adapter.t(deaths === 1 ? "PERSONA.Bonds.ChangeDead1" : "PERSONA.Bonds.ChangeDead").replace("{n}", deaths));
        if (other) parts.push(this.adapter.t(other === 1 ? "PERSONA.Bonds.ChangeStatus1" : "PERSONA.Bonds.ChangeStatus").replace("{n}", other));
        if (c.linkIds.length) parts.push(this.adapter.t(c.linkIds.length === 1 ? "PERSONA.Bonds.ChangeLinks1" : "PERSONA.Bonds.ChangeLinks").replace("{n}", c.linkIds.length));
        if (!parts.length) return "";
        return `<div class="bonds-changes">
            <div class="bonds-changes__text"><b>${esc(this.t("SinceLast"))}</b><span>${esc(parts.join(", "))}</span></div>
            ${people.length ? `<div class="bonds-changes__faces">${people.slice(0, 6).map(e => `
                <button type="button" class="bonds-changes__face ${e.status && e.status !== "alive" ? `is-${e.status}` : ""}" data-action="select" data-id="${esc(e.id)}" title="${esc(e.name ?? "???")}"><img class="persona-fit" src="${esc(e.img)}" style="${esc(e.frame ?? "")}" alt=""></button>`).join("")}${people.length > 6 ? `<span class="bonds-changes__more">+${people.length - 6}</span>` : ""}</div>` : ""}
            <button type="button" class="persona-mini" data-action="ackChanges">${esc(this.t("GotIt"))}</button>
        </div>`;
    }

    #renderBanner() {
        const m = this.#model;
        const moment = m.momentId ? m.moments.find(x => x.id === m.momentId) : null;
        if (moment) {
            const lines = this.#diffLines(moment.diff);
            return `<div class="bonds-banner bonds-banner--moment"><div class="bonds-banner__row"><i class="fa-solid fa-clock-rotate-left" inert></i>
                <span>${esc(this.t("Viewing"))} <b>${esc(moment.label)}</b></span>
                <button type="button" class="persona-mini" data-action="moment" data-id="">${esc(this.t("BackToNow"))}</button>
                ${m.isGM ? `<button type="button" class="persona-mini persona-mini--icon" data-action="deleteMoment" data-id="${esc(moment.id)}" title="${esc(this.t("DeleteMoment"))}" aria-label="${esc(this.t("DeleteMoment"))}"><i class="fa-solid fa-trash" inert></i></button>` : ""}
                </div>
                ${lines.length ? `<ul class="bonds-banner__diff">${lines.slice(0, 6).map(l => `<li>${l}</li>`).join("")}${lines.length > 6 ? `<li class="is-more">+${lines.length - 6}</li>` : ""}</ul>` : `<p class="bonds-banner__none">${esc(this.t("NoChangesInMoment"))}</p>`}
            </div>`;
        }
        if (this.#linkMode) {
            const from = this.#nodeInfo(this.#linkFrom)?.name ?? "";
            return `<div class="bonds-banner bonds-banner--link"><i class="fa-solid fa-link" inert></i><span>${esc(this.adapter.t("PERSONA.Bonds.LinkPickTarget").replace("{name}", from))}</span>
                <button type="button" class="persona-mini" data-action="cancelLink">${esc(this.t("Cancel"))}</button></div>`;
        }
        return "";
    }

    /** Find someone on a big wheel, and thin it out by hiding the dead. */
    #renderFinder(entries) {
        const placed = this.#bonds.placements.filter(p => entries.has(p.id));
        const scene = (this.#model.inScene ?? []).filter(id => entries.has(id));
        if (placed.length < 8 && !scene.length) return "";
        const dead = placed.length >= 8 ? placed.filter(p => entries.get(p.id).status === "dead").length : 0;
        return `<div class="bonds-finder">
            ${scene.length ? `<button type="button" class="persona-mini bonds-scene ${this.#sceneOnly ? "is-on" : ""}" data-action="toggleScene" aria-pressed="${this.#sceneOnly}" title="${esc(this.t("InSceneHint"))}"><i class="fa-solid fa-map-location-dot" inert></i><span>${esc(this.adapter.t("PERSONA.Bonds.InScene").replace("{n}", scene.length))}</span></button>` : ""}
            ${placed.length >= 8 ? `<label class="bonds-search bonds-search--wheel"><i class="fa-solid fa-magnifying-glass" inert></i>
                <input type="search" name="bondsFind" placeholder="${esc(this.t("FindOnWheel"))}" autocomplete="off"></label>
            <div class="bonds-finder__results" data-find-results hidden></div>` : ""}
            ${dead ? `<button type="button" class="persona-mini ${this.#hideDead ? "is-on" : ""}" data-action="toggleDead" aria-pressed="${this.#hideDead}"><i class="fa-solid ${this.#hideDead ? "fa-eye" : "fa-skull"}" inert></i><span>${esc(this.#hideDead ? this.adapter.t("PERSONA.Bonds.ShowDead").replace("{n}", dead) : this.adapter.t("PERSONA.Bonds.HideDead").replace("{n}", dead))}</span></button>` : ""}
        </div>`;
    }

    #onFind(value) {
        const box = this.host.querySelector("[data-find-results]");
        if (!box) return;
        const q = value.trim().toLowerCase();
        const placed = new Set(this.#bonds.placements.map(p => p.id));
        const hits = q ? this.#model.entries.filter(e => placed.has(e.id) && (e.name ?? "").toLowerCase().includes(q)).slice(0, 8) : [];
        box.hidden = !hits.length;
        box.innerHTML = hits.map(e => `<button type="button" data-action="findGo" data-id="${esc(e.id)}"><img src="${esc(e.img)}" alt=""><span>${esc(e.name)}</span></button>`).join("");
    }

    /** Moves the camera so a portrait sits in the middle of the view. */
    #centerOn(id) {
        const node = this.#laid?.nodes.get(id);
        const viewport = this.host.querySelector("[data-viewport]");
        if (!node || !viewport) return;
        const { width, height } = viewport.getBoundingClientRect();
        const s = Math.max(this.#cam.s, Math.min(width, height) / 700);
        this.#cam = { s, x: width / 2 - node.x * s, y: height / 2 - node.y * s, auto: false };
        this.#applyCam();
    }

    /** A moment's changes for this wheel, as short readable lines (HTML-escaped). */
    #diffLines(diff) {
        if (!diff) return [];
        const name = id => esc(this.#model.entries.find(e => e.id === id)?.name ?? "???");
        const ring = r => esc(this.t(`Ring${r}`));
        const moves = new Map(diff.moves ?? []);
        const out = [];
        for (const id of diff.died) out.push(`<i class="fa-solid fa-skull" inert></i> ${this.adapter.t("PERSONA.Bonds.DiffDied").replace("{name}", name(id))}`);
        for (const id of diff.missing) out.push(`<i class="fa-solid fa-question" inert></i> ${this.adapter.t("PERSONA.Bonds.DiffMissing").replace("{name}", name(id))}`);
        for (const id of diff.added) out.push(`<i class="fa-solid fa-plus" inert></i> ${this.adapter.t("PERSONA.Bonds.DiffAdded").replace("{name}", name(id))}`);
        for (const id of [...diff.closer, ...diff.farther]) {
            const [from, to] = moves.get(id) ?? [];
            out.push(`<i class="fa-solid ${to < from ? "fa-arrow-down-short-wide" : "fa-arrow-up-wide-short"}" inert></i> ${name(id)}: ${ring(from)} → ${ring(to)}`);
        }
        return out;
    }

    /**
     * Saves the wheel as a PNG to share (e.g. in the campaign's chat at the end of an arc): the
     * wheel itself, every portrait with its name, the links, and a title. Drawn on a canvas at 2x.
     */
    async #exportImage() {
        const m = this.#model;
        const laid = this.#laid;
        const g = laid.g;
        const R = g.labelRadius + 46;
        const scale = 2;
        const size = Math.ceil(2 * R * scale);
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.translate(R - G.center, R - G.center);
        ctx.fillStyle = "#16130f";
        ctx.fillRect(G.center - R, G.center - R, 2 * R, 2 * R);

        // 1. The SVG (slices, rings, labels, links), with its computed styles inlined.
        const source = this.host.querySelector(".bonds-svg");
        if (source) {
            const clone = source.cloneNode(true);
            const props = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray", "opacity", "font-family", "font-size", "font-weight", "letter-spacing", "text-transform", "paint-order"];
            const from = [source, ...source.querySelectorAll("*")];
            const to = [clone, ...clone.querySelectorAll("*")];
            from.forEach((el, i) => {
                const cs = getComputedStyle(el);
                to[i].setAttribute("style", props.map(prop => `${prop}:${cs.getPropertyValue(prop)}`).join(";"));
            });
            clone.querySelector("[data-rubber]")?.remove();
            clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
            clone.setAttribute("viewBox", `${G.center - R} ${G.center - R} ${2 * R} ${2 * R}`);
            clone.setAttribute("width", 2 * R);
            clone.setAttribute("height", 2 * R);
            const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
            try {
                const img = await this.#loadImage(url);
                if (img) ctx.drawImage(img, G.center - R, G.center - R, 2 * R, 2 * R);
            } finally { URL.revokeObjectURL(url); }
        }

        // 2. Portraits and names.
        const frameOf = style => {
            const num = (key, def) => Number(String(style ?? "").match(new RegExp(`--${key}:\\s*([\\d.]+)`))?.[1] ?? def);
            return { fx: num("fx", 50) / 100, fy: num("fy", 20) / 100, zoom: num("zoom", 1) };
        };
        const drawPortrait = async (x, y, r, src, { frame = "", ring = "#d9c79e", status = "alive", label = "" } = {}) => {
            const img = await this.#loadImage(src);
            ctx.save();
            ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.fillStyle = "#0f0e0c"; ctx.fill();
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
            ctx.fillStyle = "#2c2723"; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
            if (img) {
                const { fx, fy, zoom } = frameOf(frame);
                const d = 2 * r;
                const k = Math.max(d / img.naturalWidth, d / img.naturalHeight) * zoom;
                const w = img.naturalWidth * k, h = img.naturalHeight * k;
                if (status === "dead") ctx.filter = "grayscale(1) brightness(0.62)";
                else if (status === "missing") ctx.filter = "grayscale(0.6) sepia(0.3) brightness(0.8)";
                ctx.drawImage(img, x - r - (w - d) * fx, y - r - (h - d) * fy, w, h);
                ctx.filter = "none";
            }
            ctx.restore();
            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.lineWidth = 2; ctx.strokeStyle = ring; ctx.stroke();
            if (status === "dead" || status === "missing") {
                ctx.beginPath(); ctx.arc(x + r * 0.72, y + r * 0.72, 8, 0, Math.PI * 2); ctx.fillStyle = "#0f0e0c"; ctx.fill();
                ctx.fillStyle = "#eadfc4"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(status === "dead" ? "✝" : "?", x + r * 0.72, y + r * 0.72 + 0.5);
            }
            if (label) {
                ctx.font = "600 10px Cinzel, Georgia, serif";
                const w = ctx.measureText(label).width + 12;
                ctx.fillStyle = "rgba(15,14,12,0.9)";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(x - w / 2, y + r + 4, w, 16, 3);
                else ctx.rect(x - w / 2, y + r + 4, w, 16);
                ctx.fill();
                ctx.fillStyle = "#eadfc4"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(label, x, y + r + 12.5);
            }
        };
        // Link icons: a dot in the link's colour at its middle.
        for (const link of this.#allLinks()) {
            const geo = this.#linkGeometry(link);
            if (!geo) continue;
            const type = LINK_TYPES.find(t => t.id === link.type) ?? LINK_TYPES[0];
            ctx.beginPath(); ctx.arc(geo.mid.x, geo.mid.y, 6, 0, Math.PI * 2); ctx.fillStyle = "#0f0e0c"; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = type.color; ctx.stroke();
        }
        const entries = this.#entryMap();
        const sectors = new Map(laid.sectors.map(sec => [sec.id, sec]));
        for (const p of this.#bonds.placements) {
            const pos = laid.nodes.get(p.id), e = entries.get(p.id);
            if (!pos || !e) continue;
